  when:'arrive',              /* сейчас, по билету или в выбранную минуту */
  atTime:'',                  /* выбранная минута, пока when === 'time' */
  note:'',                    /* комментарий носильщику */
  stage:'idle',               /* idle → searching → assigned → arrived → picked → delivered → rating */
  porter:null,
  left:0,
  stars:0,
  marks:[],
  tip:0
};

/* Демо-режим: на защите нельзя ждать реальные минуты. */
const DEMO = { search:2500, meet:12, carry:12, scan:2000 };

const $ = (id) => document.getElementById(id);

let tickTimer = null, searchTimer = null, scanTimer = null, phraseTimer = null;

function replay(el, cls){
  if(!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

/* ============================================================================
   РАСЧЁТ И ФОРМАТ
   ========================================================================= */

function stById(id){
  return STATIONS.find(s => s.id === id) || STATIONS[0];
}

function stationOf(){
  const id = state.trip ? state.trip.station : state.station;
  return STATIONS.find(s => s.id === id) || STATIONS[0];
}

/* Запасной вариант обязателен: билет разворачивает поездку, а с ней и набор
   зон — выбранной раньше зоны в новом наборе может не быть. */
function zoneOf(){
  const list = zones();
  return list.find(z => z.id === state.zone) || list[0];
}
function sizeOf(){ return SIZES.find(s => s.id === state.size); }

/* Цена первой вещи зависит от её размера, каждая следующая стоит 50 ₽.
   Второй носильщик — ещё 200 ₽: это вторая пара рук, а не наценка,
   и зовут её количество, а не вес. Один человек с тележкой увозит и
   тридцать килограммов; чего он не может — уследить за четырьмя вещами
   сразу в потоке людей. От зоны цена не зависит: все точки внутри
   вокзала, и разница в паре сотен шагов. */
function calc(){
  const st = stationOf(), zn = zoneOf(), sz = sizeOf();
  const two = state.bags > 3;
  const sum = sz.base + 50 * (state.bags - 1) + (two ? 200 : 0);
  return { sum:sum, people: two ? 2 : 1, st:st, zn:zn };
}

/* В комментарий пишет человек, а вставляем мы его в строку разметки */
const esc = (s) => s.replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);

const money = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if(a === 1 && b !== 11) return one;
  if(a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}

function places(){
  const u = sizeOf().unit;
  return state.bags + ' ' + plural(state.bags, u[0], u[1], u[2]);
}

/* Пассажир уезжает — значит, багаж несут не в вокзал, а из вокзала к поезду. */
function outbound(){ return !!state.trip && state.trip.dir === 'out'; }

/* Конец пути: у приехавшего это зона вокзала, у уезжающего — его вагон. */
function destName(){ return outbound() ? 'Вагон ' + state.trip.car : zoneOf().name; }
function destGen(){  return outbound() ? 'вагона ' + state.trip.car : zoneOf().gen; }

/* Сдвиг по часам в обе стороны, с переходом через полночь: поезда в 00:20
   бывают, и подача к ним считается на вчерашние сутки. */
function shiftMin(hhmm, m){
  const p = hhmm.split(':');
  let t = ((+p[0]) * 60 + (+p[1]) + m) % 1440;
  if(t < 0) t += 1440;
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' +
         String(t % 60).padStart(2, '0');
}

/* Уезжающего носильщик встречает не в минуту отправления: до вагона ещё идти,
   а багаж перед этим надо принять и записать. */
function boardTime(){ return shiftMin(state.trip.time, -25); }

/* Часы телефона нужны ровно в одном месте — когда билета ещё нет
   и отсчитывать сетку не от чего. */
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' +
         String(d.getMinutes()).padStart(2, '0');
}

/* Восемь шагов по пятнадцать минут — два часа выбора. Больше не нужно:
   носильщика зовут в день поездки и под конкретный поезд, а не на неделю
   вперёд. Край сетки всегда упирается в билет, поэтому промахнуться
   мимо своего поезда нельзя — таких минут в списке просто нет. */
function timeSlots(){
  const n = 8, step = 15, out = [];
  const anchor = state.trip ? (outbound() ? boardTime() : state.trip.time)
                            : shiftMin(nowHM(), 15);
  for(let i = 0; i < n; i++)
    out.push(shiftMin(anchor, outbound() ? -step * (n - 1 - i) : step * i));
  return out;
}

/* Когда встретят. Точка отсчёта у пассажира одна — время прибытия из билета:
   либо он уже на перроне и носильщик идёт сейчас, либо поезд ещё в пути
   и встреча назначена на минуту прибытия. */
function whenText(){
  if(state.when === 'now')  return 'через ' + stationOf().wait + ' мин';
  if(state.when === 'time') return 'в ' + state.atTime;
  if(!state.trip) return 'к прибытию поезда';
  return 'в ' + (outbound() ? boardTime() : state.trip.time);
}

/* Цена слушается количества вещей сильнее, чем размера: каждая следующая
   стоит 50 ₽, а четвёртая зовёт вторую пару рук и добавляет сразу 200 ₽.
   Сказать об этом надо до нажатия плюса — после это уже не предупреждение,
   а объяснение скачка. */
function bagsHint(){
  const sz = sizeOf();
  if(state.bags >= 4)
    return { txt:'Работают двое: +200 ₽ в сумме', warn:true };
  if(state.bags === 3)
    return { txt:sz.warn, warn:true };
  return { txt:sz.next, warn:false };
}

/* Носильщик ждёт не у двери вагона. Из состава разом выходит несколько сот
   человек, и поиск друг друга в этой толпе — худшая часть услуги. Встреча
   всегда в одной размеченной точке у выхода с платформы: её видно издалека
   и её можно показать на схеме. */
function meetPlace(){
  if(outbound()){
    const z = zoneOf();
    return z.name + ', ' + z.sub;
  }
  return state.trip
    ? 'Платформа ' + state.trip.platform + ', у выхода с перрона'
    : 'У выхода с платформ';
}

function mmss(sec){
  if(sec < 0) sec = 0;
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

/* Маршрутная лента: старт → промежуточные точки → зона передачи */
function routePoints(){
  const zn = zoneOf(), t = state.trip;
  const zone  = { nm:zn.name, ph:zn.ph };
  const table = outbound() ? ZONE_ROUTE_OUT : ZONE_ROUTE;
  const mid   = (table[zn.id] || []).map(nm => ({ nm:nm, ph:nm.toLowerCase() }));

  /* Лента читается в ту сторону, в какую едет пассажир: приехал — от платформы
     вглубь вокзала, уезжает — из вокзала к своему вагону. */
  const pts = outbound()
    ? [zone].concat(mid, [{ nm:'Вагон ' + t.car, ph:'платформа' }])
    : [t ? { nm:'Платформа ' + t.platform, ph:'зона встречи' }
         : { nm:'Зона встречи', ph:'зона встречи' }].concat(mid, [zone]);

  /* две одинаковые точки подряд смысла не несут */
  return pts.filter((p, i) => i === 0 || p.nm !== pts[i - 1].nm);
}

/* На какой точке маршрута мы сейчас */
function routeIndex(){
  const last = routePoints().length - 1;
  if(state.stage === 'picked') return Math.min(1, last);
  if(state.stage === 'delivered' || state.stage === 'rating') return last;
  return 0;
}

/* Старое значение уезжает вверх, новое приезжает снизу.
   Текущий элемент ищем среди не уезжающих — иначе за время анимации
   в контейнере накапливаются лишние span. */
function rollTo(host, text){
  if(!host) return;
  const cur = host.querySelector('span:not(.out)');
  if(cur && cur.textContent === text) return;
  if(!cur){ host.innerHTML = '<span>' + text + '</span>'; return; }
  cur.classList.add('out');
  setTimeout(() => cur.remove(), 200);
  const next = document.createElement('span');
  next.textContent = text;
  host.appendChild(next);
}

function say(msg){ $('live-msg').textContent = msg; }

/* ============================================================================
   ГЛАВНАЯ
   ========================================================================= */

function phBlock(cls, label){
  return '<span class="' + cls + ' ph">' + label + '</span>';
}

/* Слот под снимок: есть файл — показываем его, нет — запасной вариант.
   Так пустой слот не выглядит поломкой, а фото подставляется одной строкой. */
function photo(src, alt, cls, fallback){
  return src
    ? '<img class="' + cls + '" src="' + src + '" alt="' + alt + '" loading="lazy">'
    : (fallback || phBlock(cls, alt));
}

function renderStationCards(){
  /* Пока билет не отсканирован, вокзал в state — просто значение по умолчанию.
     Подписывать им чужую карточку «Ваш вокзал» нельзя: пассажир поверит. */
  const here = state.trip ? state.trip.station : null;

  $('st-cards').innerHTML = STATIONS.map(s =>
    '<button class="stile" type="button" data-st="' + s.id + '">' +
      photo(PHOTOS.station[s.id], s.name, 'stile__art') +
      '<span class="stile__txt">' +
        '<span class="stile__nm">' + s.short + '</span>' +
        '<span class="stile__sub">' + s.dir + '</span>' +
        (s.id === here
          ? '<span class="stile__here">Ваш вокзал</span>'
          : '<span class="stile__sub">Подача от ' + s.wait + ' мин</span>') +
      '</span>' +
    '</button>').join('');
}

/* Приветствие вместо названия приложения: пассажир и так знает,
   что он открыл, — ему полезнее время суток и его собственный рейс. */
function greeting(){
  const h = new Date().getHours();
  if(h < 5)  return 'Доброй ночи';
  if(h < 12) return 'Доброе утро';
  if(h < 18) return 'Добрый день';
  return 'Добрый вечер';
}

function renderTopbar(){
  $('greeting').textContent = greeting();
}

/* Конец пути уезжающего — вагон, и показан он тем же снимком платформы,
   что в карточке маршрута и в чеке. Плоская чёрточка среди объёмных предметов
   читалась как сбой вёрстки, а не как другой тип поездки. */
function carIc(){
  return '<span class="row__ic row__ic--shot">' +
    photo(PHOTOS.meet, '', 'ic3d', icon('plat', 21)) +
  '</span>';
}

function histRow(h, i){
  const out = h.dir === 'out';
  return '<button class="row" type="button" data-act="past" data-i="' + i + '">' +
    (out ? carIc() : zoneIc(zoneByName(h.zone))) +
    '<span class="row__body">' +
      '<span class="row__label">' + h.date + ' · ' +
        (out ? 'вагон ' + h.car : h.zone.toLowerCase()) + '</span>' +
      '<span class="row__value">' + stById(h.st).name + '</span>' +
    '</span>' +
    '<span class="row__extra nums">' + money(h.sum) + '</span>' +
    '<span class="row__chev">' + icon('chev', 18, 2) + '</span>' +
  '</button>';
}

/* Последний заказ — самый частый сценарий: тот же вокзал, та же зона */
function renderLast(){
  const on = state.stage === 'idle';
  $('last-title').hidden = !on;
  $('last').hidden = !on;
  if(on) $('last').innerHTML = histRow(HISTORY[0], 0);
}

/* Плашка активного заказа — аналог плашки активной поездки */
function renderActive(){
  const on = state.stage !== 'idle';
  $('active').hidden = !on;
  if(!on) return;

  const p = state.porter;
  $('active-face').innerHTML = p ? portrait(p) : '';

  const titles = {
    searching: 'Ищем носильщика',
    assigned:  p ? p.name + ' идёт к вам' : 'Носильщик идёт',
    arrived:   p ? p.name + ' на месте' : 'Носильщик на месте',
    picked:    'Багаж у носильщика',
    delivered: 'Багаж передан',
    rating:    'Оцените работу'
  };
  const subs = {
    searching: 'Смотрим свободных на ' + stationOf().short.toLowerCase(),
    assigned:  meetPlace(),
    arrived:   'Назовите код — и передайте багаж',
    picked:    'Несёт до ' + destGen(),
    delivered: 'Пересчитайте багаж: ' + places(),
    rating:    p ? 'Жилет №' + p.vest : ''
  };

  $('active-name').textContent = titles[state.stage] || '';
  $('active-sub').textContent = subs[state.stage] || '';

  const showEta = state.stage === 'assigned' || state.stage === 'picked';
  $('active-eta').innerHTML = showEta
    ? mmss(state.left) + '<small>' + (state.stage === 'picked' ? 'до передачи' : 'до встречи') + '</small>'
    : '';
}

/* Плитка действия. Пока заказ идёт — она ведёт в заказ, а не начинает второй. */
function renderCta(){
  const idle = state.stage === 'idle';
  const st = stationOf();
  const from = Math.min.apply(null, SIZES.map(s => s.base));

  $('call-art').innerHTML = photo(PHOTOS.cta, '', 'tile__cart', '');
  $('call-label').textContent = idle ? 'Вызвать носильщика' : 'Ваш заказ';
  $('call-sub').textContent = idle
    ? 'подача от ' + st.wait + ' мин · от ' + money(from)
    : stageLine().t;
}

function renderHome(){
  renderTopbar();
  renderCta();
  $('hist-art').innerHTML = photo(PHOTOS.hist, 'История — мои прошлые поездки', 'tile__photo', '');
  $('me-art').innerHTML = photo(PHOTOS.me, 'Личный кабинет — профиль и баллы', 'tile__photo', '');
  renderLast();
  renderStationCards();
  renderActive();
}

/* ============================================================================
   НАВИГАЦИЯ. Два контейнера с одинаковым устройством: экран и шит.

   Экран — для всего, что требует внимания и занимает время: билет, заказ,
   кабинет, история. У экрана своя шапка и стрелка назад.
   Шит — только для короткого пояснения поверх экрана: выбрать вокзал,
   посмотреть карту зон, прочитать про оплату.

   Рендеры у них общие, поэтому body() и foot() пишут в тот контейнер,
   который сейчас рисуется.
   ========================================================================= */

let host = 'page';          /* 'page' | 'sheet' — куда сейчас пишут body/foot */

const PAGES = {
  ticket:  { title:'Билет',             render:sheetTicket },
  manual:  { title:'Номер билета',      render:sheetManual },
  form:    { title:'Заказ',             render:sheetOrderForm },
  search:  { title:'Ищем носильщика',   render:sheetSearch },
  order:   { title:'Ваш заказ',         render:sheetOrder },
  history: { title:'История заказов',   render:sheetHistory },
  past:    { title:'Заказ',             render:sheetPastOrder },
  me:      { title:'Кабинет',           render:sheetMe }
};

const SHEETS = {
  stinfo:  { title:'Вокзал',            render:sheetStationInfo },
  cmnt:    { title:'Комментарий',       render:sheetComment },
  zmap:    { title:'Место встречи',     render:sheetZoneMap },
  when:    { title:'Во сколько встретить', render:sheetWhen },
  note:    { title:'Носильщик',         render:sheetNote }
};

/* --- экраны --- */

let pages = [];

function openPage(name, arg){ pages = [{ name:name, arg:arg }]; paintPage(); }
function pushPage(name, arg){ pages.push({ name:name, arg:arg }); paintPage(); }

/* Замена текущего шага без роста стека: назад с заказа ведёт на главную,
   а не обратно в сканер — билет уже распознан, пересканировать нечего */
function swapPage(name, arg){
  pages[pages.length - 1] = { name:name, arg:arg };
  paintPage();
}

function backPage(){
  if(pages.length <= 1) return goHome();
  pages.pop();
  paintPage();
}

function paintPage(){
  const cur = pages[pages.length - 1];
  const def = PAGES[cur.name];

  closeSheet();
  $('scr-home').hidden = true;
  $('page').hidden = false;
  $('page-title').textContent = def.title;
  $('page-foot').hidden = true;
  $('page-foot').innerHTML = '';
  $('page-body').innerHTML = '';

  host = 'page';
  def.render(cur.arg);
  window.scrollTo(0, 0);
}

function goHome(){
  pages = [];
  closeSheet();
  $('page').hidden = true;
  $('scr-home').hidden = false;
  clearTimeout(scanTimer);
  clearInterval(phraseTimer);
  renderHome();
  window.scrollTo(0, 0);
}

/* Открыт ли сейчас именно этот экран — таймеры не должны стрелять в пустоту */
function isOpen(name){
  return !$('page').hidden && pages.length && pages[pages.length - 1].name === name;
}

/* --- шиты --- */

let stack = [];

function openSheet(name, arg){
  stack = [{ name:name, arg:arg }];
  paintSheet();
}

function pushSheet(name, arg){
  stack.push({ name:name, arg:arg });
  paintSheet();
}

function backSheet(){
  if(stack.length <= 1) return closeSheet();
  stack.pop();
  paintSheet();
}

function paintSheet(){
  const cur = stack[stack.length - 1];
  const def = SHEETS[cur.name];

  $('sheet').hidden = false;
  $('sheet-title').textContent = def.title;
  $('sheet-back').classList.toggle('off', stack.length <= 1);
  $('sheet-foot').hidden = true;
  $('sheet-foot').innerHTML = '';
  $('sheet-body').innerHTML = '';
  $('sheet-body').scrollTop = 0;

  host = 'sheet';
  def.render(cur.arg);
  host = 'page';

  sheetEdge();
}

/* Долистали до конца — край перестаёт гаснуть */
function sheetEdge(){
  const b = $('sheet-body');
  b.classList.toggle('sheet__body--more',
    b.scrollHeight - b.clientHeight - b.scrollTop > 8);
}

function closeSheet(){
  $('sheet').hidden = true;
  stack = [];
}

function body(html){ $(host + '-body').innerHTML = html; }

function foot(html){
  $(host + '-foot').innerHTML = html;
  $(host + '-foot').hidden = !html;
}

function fact(label, value){
  return '<span class="code code--fact">' + label + '<b class="nums">' + value + '</b></span>';
}

function mainBtn(act, label, price, disabled){
  return '<button class="btn btn--main" type="button" data-act="' + act + '"' +
    (disabled ? ' disabled' : '') + '>' +
    '<span>' + label + '</span>' +
    '<span class="roll" data-roll="1">' + (price ? '<span>' + price + '</span>' : '') + '</span>' +
    '</button>';
}

/* ============================================================================
   ШАГ 1 — БИЛЕТ. Обязательный: без билета мы не знаем ни вагона, ни времени,
   а вся работа носильщика привязана именно к ним.
   ========================================================================= */

/* Два номера для показа: по сумме цифр они попадают в разные рейсы, и один
   билет привозит пассажира на вокзал, а другой увозит. Без второго примера
   обратный маршрут на защите пришлось бы подбирать наугад. */
const DEMO_TICKET     = '74120093814021';   /* приезд: Сапсан 754, Ленинградский */
const DEMO_TICKET_OUT = '74120093814051';   /* отъезд: Сапсан 761, Ленинградский */

function sheetTicket(){
  body(
    '<div class="mid">' +
      '<p class="lead">Наведите камеру на билет.</p>' +
      '<button class="scan" type="button" data-act="scan" aria-label="Распознать билет">' +
        '<span class="scan__frame"><i></i><i></i><i></i><i></i></span>' +
        '<span class="scan__line"></span>' +
        '<span class="scan__hint">Билет в рамке</span>' +
      '</button>' +
      '<div class="reads">' +
        '<span class="reads__t">Возьмём из билета</span>' +
        '<span class="reads__l">' +
          '<b>Вокзал</b><b>Поезд и вагон</b><b>Время и платформа</b>' +
        '</span>' +
      '</div>' +
      '<button class="linkbtn" type="button" data-act="manual">Ввести номер вручную</button>' +
    '</div>'
  );

  /* Демо-режим: ждать сканер не обязательно — тап по рамке распознаёт сразу */
  clearTimeout(scanTimer);
  scanTimer = setTimeout(() => { if(isOpen('ticket')) applyTicket(DEMO_TICKET); }, DEMO.scan);
}

function sheetManual(){
  body(
    '<p class="lead">Номер электронного билета — 14 цифр, он есть в письме и в приложении перевозчика.</p>' +
    '<div class="field">' +
      '<input id="tk" type="text" inputmode="numeric" maxlength="17" ' +
        'placeholder="7412 0093 8140 21" aria-label="Номер билета">' +
    '</div>' +
    '<div class="tags">' +
      '<button class="tag" type="button" data-act="demo-ticket" ' +
        'data-t="' + DEMO_TICKET + '">Пример: еду с поезда</button>' +
      '<button class="tag" type="button" data-act="demo-ticket" ' +
        'data-t="' + DEMO_TICKET_OUT + '">Пример: еду на поезд</button>' +
    '</div>'
  );
  foot(mainBtn('read-manual', 'Найти рейс', '', true));
  setTimeout(() => { const f = $('tk'); if(f) f.focus(); }, 220);
}

/* Номер разбирается в один из известных рейсов — чтобы демо было устойчивым */
function readTicket(value){
  const digits = value.replace(/\D/g, '');
  if(digits.length < 14) return null;
  const sum = digits.split('').reduce((a, d) => a + (+d), 0);
  return TRIPS[sum % TRIPS.length];
}

function applyTicket(raw){
  const trip = readTicket(raw);
  if(!trip) return;
  clearTimeout(scanTimer);
  state.trip = trip;
  state.station = trip.station;

  /* Новый билет мог развернуть поездку, а с ней и набор зон: выбранной
     раньше зоны в новом наборе может не оказаться. */
  if(!zones().some(z => z.id === state.zone)) state.zone = zones()[0].id;
  if(state.when === 'now' && nowOff()) state.when = 'arrive';

  renderTopbar();
  say('Билет распознан: ' + trip.train + ', вагон ' + trip.car);
  buzz('ok');                      /* глаза на билете, а не на экране */

  /* билет распознан — шаг сканера в стеке больше не нужен: «назад»
     с формы заказа должно вести на главную, а не обратно в сканер */
  swapPage('form');
}

/* ============================================================================
   ШАГ 2 — ЗАКАЗ. Зона и багаж на одном экране: пассажир держит чемоданы
   и не должен листать мастер из четырёх шагов. Цена пересчитывается на лету.
   ========================================================================= */

function passHTML(){
  const t = state.trip;
  if(!t) return '';
  const st = STATIONS.find(s => s.id === t.station);
  return '<div class="pass">' +
    '<div class="pass__top"><span class="pass__train">' + t.train + '</span></div>' +
    '<div class="pass__way">' +
      (t.dir === 'out' ? st.name + ' → ' + t.city : t.city + ' → ' + st.name) +
    '</div>' +
    '<div class="pass__tear"></div>' +
    '<div class="pass__grid nums">' +
      '<span><b>' + t.time + '</b><span>' +
        (t.dir === 'out' ? 'отправление' : 'прибытие') + '</span></span>' +
      '<span><b>' + t.car + '</b><span>вагон</span></span>' +
      '<span><b>' + t.platform + '</b><span>платформа</span></span>' +
    '</div>' +
  '</div>';
}

/* Иконка зоны: пока картинки нет — линейный значок, чтобы список
   не разъезжался. */
/* Зона прошлого заказа хранится названием — по нему и находим значок. */
/* История хранит зону названием и помнит оба набора сразу: поездка туда
   и поездка обратно лежат в одном списке. */
function zoneByName(name){
  return ZONES_IN.concat(ZONES_OUT).find(z => z.name === name) || ZONES_IN[0];
}

function zoneIc(z, wrap, size){
  const art = PHOTOS.zone[z.id];
  return '<span class="' + (wrap || 'row__ic') + (art ? ' is-art' : '') + '">' +
    photo(art, '', 'ic3d', icon(z.art, size || 21)) +
  '</span>';
}

/* Строки «куда донести» — без своей обёртки: они лежат в карточке маршрута
   сразу под точкой встречи, чтобы А и Б читались как одна пара. */
function zoneRows(){
  return zones().map(z =>
    '<button class="row" type="button" data-act="zone" data-id="' + z.id + '">' +
      zoneIc(z) +
      '<span class="row__body">' +
        '<span class="row__value">' + z.name + '</span>' +
        '<span class="row__label">' + z.sub + '</span>' +
      '</span>' +
      '<span class="check' + (z.id === state.zone ? ' on' : '') + '">' + icon('check', 13, 2.4) + '</span>' +
    '</button>').join('');
}

/* Форма заказа отвечает на три вопроса: откуда и куда несут багаж, когда
   встретят и что именно несём. Маршрут собран в одну карточку: место встречи
   и место передачи — два конца одного пути, и разного вида им быть незачем.
   Ленты маршрута здесь нет: пока заказа не существует, показывать по ней
   нечего. */
/* Строка с платформой. У приехавшего это начало пути и место встречи,
   у уезжающего — конец пути и его вагон. Строка одна: это два конца одного
   маршрута, и выглядеть по-разному им незачем. */
function platRow(){
  const t = state.trip, out = outbound();
  const value = !t ? 'Встреча у выхода с платформ'
    : out ? 'Вагон ' + t.car + ' · платформа ' + t.platform
          : 'Встреча у платформы ' + t.platform;
  const label = out ? 'Донесём к поезду — посмотреть выход'
                    : 'Выход с перрона — посмотреть место';
  return '<button class="row row--from" type="button" data-act="zone-map">' +
      '<span class="row__ic row__ic--shot">' +
        photo(PHOTOS.meet, '', 'ic3d', icon('plat', 21)) +
      '</span>' +
      '<span class="row__body">' +
        '<span class="row__value">' + value + '</span>' +
        '<span class="row__label">' + label + '</span>' +
      '</span>' +
      '<span class="row__chev">' + icon('chev', 18) + '</span>' +
    '</button>';
}

function sheetOrderForm(){
  body(
    passHTML() +

    '<div class="group">Маршрут</div>' +
    '<div class="rows">' +
      (outbound()
        ? '<div class="rows__sep">Откуда забрать</div>' + zoneRows() +
          '<div class="rows__sep">Куда донести</div>' + platRow()
        : platRow() + '<div class="rows__sep">Куда донести</div>' + zoneRows()) +
    '</div>' +

    '<div class="group">Когда встретить</div>' +
    '<div class="when" id="when"></div>' +

    '<div class="group">Что несём</div>' +
    '<div class="sizes" id="sizes"></div>' +

    '<div class="bagsn">' +
      '<span class="bagsn__txt">' +
        '<b class="bagsn__n nums" id="bags-n">1 чемодан</b>' +
        '<span class="bagsn__hint" id="bags-hint"></span>' +
      '</span>' +
      '<span class="stepper__ctl">' +
        '<button type="button" data-act="bag-minus" aria-label="Меньше">−</button>' +
        '<button type="button" data-act="bag-plus" aria-label="Больше">+</button>' +
      '</span>' +
    '</div>' +

    '<button class="meet" type="button" data-act="cmnt">' +
      '<span class="meet__ic">' + icon('chat', 20) + '</span>' +
      '<span class="meet__txt"><b>Комментарий носильщику</b><span>' +
        (state.note ? esc(state.note) : 'Что важно знать про багаж') +
      '</span></span>' +
      '<span class="meet__chev">' + icon('chev', 18) + '</span>' +
    '</button>' +

    '<div class="group">Расчёт</div>' +
    '<div class="bill" id="bill"></div>'
  );
  foot(mainBtn('call', 'Вызвать за', money(calc().sum)));

}

/* Дерево зон для справки о вокзале: от места встречи к каждой из точек.
   Здесь ничего не выбирают — это описание услуги, а не список. */
function zoneTree(){
  const branch = (z) => {
    /* в ветке — путь от места встречи до зоны, без описания здания;
       последняя точка совпадает с названием зоны и в подписи не нужна */
    const table = outbound() ? ZONE_ROUTE_OUT : ZONE_ROUTE;
    const tail = (table[z.id] || []).filter(nm => nm !== z.name).join(' → ');
    return '<span class="zmap__leaf">' +
      zoneIc(z, 'zmap__ic', 20) +
      '<span class="zmap__body">' +
        '<span class="zmap__nm">' + z.name + '</span>' +
        '<span class="zmap__path">' + (tail || z.sub) + '</span>' +
      '</span>' +
    '</span>';
  };

  return '<div class="zmap">' +
      '<div class="zmap__trunk">' +
        '<span class="zmap__node"><b>' + (outbound()
          ? 'Точки, откуда забирают багаж'
          : 'Зона встречи у выхода с платформ') + '</b>' +
          '<small>' + (outbound()
            ? 'отсюда носильщик несёт к вагону'
            : 'здесь встречают приехавших') + '</small></span>' +
      '</div>' +
      '<div class="zmap__leaves">' + zones().map(branch).join('') + '</div>' +
    '</div>';
}

function sheetComment(){
  body(
    '<p class="lead">Носильщик прочитает это до того, как придёт: подготовит ремни, '
      + 'тележку или просто не будет торопить.</p>' +
    '<div class="tags">' + NOTE_TIPS.map(t =>
      '<button class="tag" type="button" data-act="note-add" data-t="' + t + '">' + t + '</button>'
    ).join('') + '</div>' +
    '<textarea class="ta" id="note-ta" rows="4" maxlength="200" ' +
      'placeholder="Например: в чемодане посуда, ставьте аккуратно"></textarea>'
  );
  foot(mainBtn('note-save', 'Сохранить'));
  $('note-ta').value = state.note;
}

/* Место встречи. Карты вокзала здесь нет и не будет: подробный план объекта
   транспортной инфраструктуры — сведения ограниченного доступа (ФЗ-16),
   а то, что мы вправе показать, пассажиру всё равно не помогает
   сориентироваться. Помогает другое: как выглядит место, где его встретят,
   и куда оттуда понесут багаж. */
function sheetZoneMap(){
  const t = state.trip, out = outbound();
  body(
    '<div class="meetshot">' +
      photo(PHOTOS.meet, 'Выход с платформы под жёлтым указателем', 'meetshot__img') +
      '<span class="meetshot__tag">Указатель «Н»</span>' +
    '</div>' +

    '<p class="lead">' + (out
      ? 'Багаж донесут до вагона ' + t.car + ' на платформе ' + t.platform +
        '. Выход к поездам — под жёлтым указателем с буквой «Н»: там же ' +
        'носильщик передаст вам вещи у двери вагона.'
      : 'Носильщик ждёт ' +
        (t ? 'у выхода с платформы ' + t.platform : 'у выхода с платформ') +
        ', под жёлтым указателем с буквой «Н». Искать его не нужно: номер ' +
        'вагона он знает из заказа и подойдёт сам.') + '</p>' +

    '<div class="group">Как понесут багаж</div>' +
    routeHTML()
  );
  foot(mainBtn('zone-done', 'Понятно'));
}

/* «Сейчас» обещает носильщика через десять минут — и это правда только для
   того, кто уже стоит на вокзале. Приехавший в эту минуту сидит в поезде:
   отдать ему чемодан некому и нечего, сколько бы носильщик ни спешил.
   Поэтому у приезда кнопка гаснет и сама говорит почему — вместо того чтобы
   принять нажатие и подставить бессмысленное время. */
function nowOff(){ return !!state.trip && !outbound(); }

/* Три ответа, и каждый — минута, а не обещание. «Сейчас» для того, кто уже
   стоит с чемоданами; «по билету» для того, кто ещё едет; «ко времени» для
   того, кто приедет на вокзал заранее и знает во сколько.
   Номер платформы с кнопок снят: он написан строкой выше, в карточке
   маршрута, а ширины на третий вариант иначе не хватает. */
function whenHTML(){
  const st = stationOf(), t = state.trip;
  const opt = (id, nm, sub, off) =>
    '<button class="whenb" type="button" data-act="when" data-id="' + id + '" ' +
      (off ? 'disabled ' : '') +
      'aria-pressed="' + (!off && state.when === id) + '">' +
      '<b>' + nm + '</b><span class="nums">' + sub + '</span>' +
    '</button>';

  return opt('now', 'Сейчас',
             nowOff() ? 'поезд в пути' : 'через ' + st.wait + ' мин', nowOff()) +
    (outbound()
      ? opt('arrive', 'К поезду',  'в ' + boardTime())
      : opt('arrive', 'К приезду', t ? 'в ' + t.time : 'по билету')) +
    opt('time', 'Ко времени',
        state.when === 'time' && state.atTime ? 'в ' + state.atTime : 'выбрать');
}

/* Сетка минут. Выбор применяется на месте и закрывает шит: подтверждать
   отдельной кнопкой нечего — нажатая минута и есть подтверждение. */
function sheetWhen(){
  body(
    '<p class="lead">' + (outbound()
      ? 'Подойдёт в зал к выбранной минуте и заберёт багаж. Позже ' +
        boardTime() + ' встречать поздно: до вагона ещё идти.'
      : 'Встретит у выхода с платформы. Раньше прибытия поезда встречать ' +
        'некого, поэтому отсчёт идёт от него.') + '</p>' +
    '<div class="slots">' + timeSlots().map(hm =>
      '<button type="button" data-act="slot" data-t="' + hm + '" ' +
        'aria-pressed="' + (state.when === 'time' && state.atTime === hm) + '">' +
        '<span class="nums">' + hm + '</span>' +
      '</button>').join('') + '</div>'
  );
  foot('');
}

/* Расчёт столбиком, а не строчкой-сноской: когда слагаемые видно по одному,
   появление второго носильщика перестаёт выглядеть ошибкой калькулятора. */
function billHTML(){
  const r = calc(), sz = sizeOf();
  const u = sz.unit;
  const rows = [[u[0].charAt(0).toUpperCase() + u[0].slice(1) + ', ' + sz.hint, sz.base]];

  if(state.bags > 1)
    rows.push(['Ещё ' + (state.bags - 1) + ' ' +
      plural(state.bags - 1, u[0], u[1], u[2]), 50 * (state.bags - 1)]);

  if(r.people === 2)
    rows.push(['Второй носильщик — от четырёх ' + u[2], 200]);

  return rows.map(row =>
      '<span class="bill__r"><span>' + row[0] + '</span>' +
        '<b class="nums">' + money(row[1]) + '</b></span>').join('') +
    '<span class="bill__r bill__r--sum"><span>Итого</span>' +
      '<b class="nums">' + money(r.sum) + '</b></span>';
}

/* Всё на форме зависит от одного состояния, поэтому и пересчитывается разом:
   плитки размера, счётчик мест, время встречи, расчёт и цена на кнопке. */
function renderBags(){
  const host = $('sizes');
  if(!host) return;

  host.innerHTML = SIZES.map(s =>
    '<button class="size" type="button" data-act="size" data-id="' + s.id + '" ' +
      'aria-pressed="' + (s.id === state.size) + '">' +
      '<span class="size__box">' +
        photo(PHOTOS.size[s.id], '', 'size__art') +
      '</span>' +
      '<span class="size__nm">' + s.name + '</span>' +
      '<span class="size__kg">' + s.hint + '</span>' +
    '</button>').join('');

  const r = calc();
  $('bags-n').textContent = places();

  const hint = bagsHint(), hn = $('bags-hint');
  if(hn){
    hn.textContent = hint.txt;
    hn.classList.toggle('warn', hint.warn);
  }

  const minus = document.querySelector('[data-act="bag-minus"]');
  const plus  = document.querySelector('[data-act="bag-plus"]');
  if(minus) minus.disabled = state.bags <= 1;
  if(plus)  plus.disabled  = state.bags >= 6;

  const when = $('when');
  if(when) when.innerHTML = whenHTML();

  const bill = $('bill');
  if(bill) bill.innerHTML = billHTML();

  rollTo(document.querySelector('[data-roll]'), money(r.sum));
}

function routeHTML(){
  const pts = routePoints();
  const idx = routeIndex();
  const live = state.stage !== 'idle';

  return '<div class="route">' + pts.map((p, i) =>
    '<span class="route__pt" data-done="' + (live && i <= idx) + '" data-cur="' + (live && i === idx) + '">' +
      '<span class="route__dot"></span>' +
      '<span class="route__nm">' + p.nm + '</span>' +
    '</span>').join('') + '</div>';
}

/* ============================================================================
   ШАГ 4 — ПОИСК
   ========================================================================= */

function sheetSearch(){
  const st = stationOf();

  /* Точки расставлены руками, а не случайно: случайные каждый раз собираются
     в кучу или в линию, и это видно. */

  body(

      '<div class="radar">' +

        '<span class="radar__sweep"></span>' +

          '<span class="radar__blip" style="--x:' + b[0] + '%;--y:' + b[1] + '%;' +
            '--d:' + (i * 0.55).toFixed(2) + 's"></span>').join('') +
        '<span class="radar__me">' + icon('plat', 21) + '</span>' +
        '<span class="radar__tag">' + st.name + '</span>' +
      '</div>' +
      '<div class="radar__txt">' +
        '<b>Обычно подходит за ' + st.wait + ' минут</b>' +
        '<span id="phrase">' + PHRASES[0] + '</span>' +
      '</div>' +
    '</div>' +

    '<div class="group">Куда несём багаж</div>' +

      '<p class="fine">' + oneStation() + '</p>' +
    '</div>'
  );
  foot('<button class="btn btn--ghost" type="button" data-act="cancel">Отменить поиск</button>');

}


/* ============================================================================
   ШИТ ЗАКАЗА. Здесь живёт весь остаток жизненного цикла, включая оценку:
   отдельного экрана «оцените поездку» нет.
   ========================================================================= */

/* Плитка действия: значок и подпись под ним. */
function actBtn(act, ic, label){
  return '<button type="button" data-act="' + act + '">' +
    '<i>' + icon(ic, 21) + '</i>' + label +
  '</button>';
}

/* Уже поставленная оценка: пять звёзд, из них n жёлтых. Пустые не прячем —
   «4 из 5» видно только тогда, когда видно и пятую. */
function starRow(n, size){
  const s = size || 16;
  const star = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" ' +
    'fill="currentColor" aria-hidden="true">' +
    '<path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8L12 3.6Z"/></svg>';
  return '<span class="starrow" role="img" aria-label="Оценка ' + n + ' из 5">' +
    [1,2,3,4,5].map(i => '<i class="' + (i <= n ? 'on' : '') + '">' + star + '</i>').join('') +
  '</span>';
}

/* Куда несём багаж — картинкой, а не строкой списка. Без аргументов берёт
   текущий заказ, с аргументами — любой прошлый. */
/* Конец пути картинкой. У приехавшего это зона вокзала, у уезжающего — вагон;
   карточка одна и та же, меняется только содержимое. */
function platShot(car, platform, st){
  return '<div class="zshot">' +
    '<span class="zshot__art zshot__art--shot">' +
      photo(PHOTOS.meet, '', '', icon('plat', 40)) +
    '</span>' +
    '<span class="zshot__txt">' +
      '<b>Вагон ' + car + '</b>' +
      '<span>' + st.short + ' · платформа ' + platform + '</span>' +
    '</span>' +
  '</div>';
}

function destShot(){
  const t = state.trip;
  return outbound() ? platShot(t.car, t.platform, stationOf()) : zoneShot();
}

function zoneShot(zn, st){
  zn = zn || zoneOf();
  st = st || stationOf();
  return '<div class="zshot">' +
    '<span class="zshot__art">' +
      photo(PHOTOS.zone[zn.id], '', '', icon(zn.art, 40)) +
    '</span>' +
    '<span class="zshot__txt">' +
      '<b>' + zn.name + '</b>' +
      '<span>' + st.short + ' · ' + zn.sub + '</span>' +
    '</span>' +
  '</div>';
}

/* Услуга целиком помещается в одно здание. Пассажиру это неочевидно:
   «доставка багажа» звучит так, будто чемодан уедет в другой город. */
function oneStation(){
  return 'Один вокзал от начала до конца: ' + stationOf().name +
    ' — где багаж приняли, там же и отдадут. Между вокзалами и городами ' +
    'носильщик багаж не возит.';
}

function porterCard(){
  const p = state.porter, r = calc();
  const showEta = state.stage === 'assigned' || state.stage === 'picked';

function startSearch(){
  state.stage = 'searching';
  renderActive();

  swapPage('search');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(assign, DEMO.search);
}

function assign(){
  const idx = (state.bags + Math.max(0, TRIPS.indexOf(state.trip))) % PORTERS.length;
  state.porter = PORTERS[idx];
  state.stage = 'assigned';
  state.left = DEMO.meet;

  say('Носильщик ' + state.porter.name + ' назначен, жилет ' + state.porter.vest);
  buzz('meet');
  renderActive();

  /* Заказ принят — шаги оформления в стеке больше не нужны: «назад»
     из активного заказа в выбор зоны привёл бы ко второму заказу. */
  if(isOpen('search')) openPage('order');
  startTick();
}

/* Один секундный таймер на обе стадии ожидания */
function startTick(){
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    state.left--;
    if(state.left > 0){
      renderActive();
      const eta = document.querySelector('#page .active__eta');
      if(eta) eta.innerHTML = mmss(state.left) +
        '<small>' + (state.stage === 'picked' ? 'до передачи' : 'до встречи') + '</small>';
      return;
    }
    clearInterval(tickTimer);
    if(state.stage === 'assigned') arrive();
    else if(state.stage === 'picked') deliver();
  }, 1000);
}

function arrive(){
  clearInterval(tickTimer);
  state.stage = 'arrived';
  state.left = 0;
  say('Носильщик на месте — передайте багаж по коду');
  buzz('meet');                    /* главная новость всего заказа */
  renderActive();
  if(isOpen('order')) paintPage();
}

function handOver(){
  state.stage = 'picked';
  state.left = DEMO.carry;
  /* Уезжающему зона — это место, где он багаж отдал. Несут его к вагону. */
  say('Багаж принят, носильщик несёт до ' + destGen());
  buzz('ok');
  renderActive();
  if(isOpen('order')) paintPage();
  startTick();
}

function deliver(){
  clearInterval(tickTimer);
  state.stage = 'delivered';
  state.left = 0;
  say('Багаж передан — проверьте фото и подтвердите');
  buzz('meet');
  renderActive();
  if(isOpen('order')) paintPage();
}

function finishOrder(){
  state.stage = 'rating';
  renderActive();
  if(isOpen('order')) paintPage();
  else openPage('order');
}

function submitRating(){
  const r = calc();
  HISTORY.unshift({
    date:'сегодня',
    st:r.st.id,
    time:new Date().toTimeString().slice(0, 5),
    zone:r.zn.name,
    dir:outbound() ? 'out' : 'in',
    car:state.trip ? state.trip.car : 0,
    platform:state.trip ? state.trip.platform : 0,
    size:state.size,
    bags:state.bags,
    tip:state.tip,
    sum:r.sum + state.tip,
    stars:state.stars
  });
  say('Спасибо! Оценка отправлена');
  buzz('ok');
  resetOrder();
  goHome();
}

function cancelOrder(){
  clearInterval(tickTimer);
  clearTimeout(searchTimer);
  say('Заказ отменён');
  resetOrder();
  goHome();
}

function resetOrder(){
  clearInterval(tickTimer);
  clearTimeout(searchTimer);
  state.stage = 'idle';
  state.porter = null;
  state.left = 0;
  state.stars = 0;
  state.marks = [];
  state.tip = 0;
  state.trip = null;
  state.bags = 1;

}

/* Тема живёт в атрибуте на <html>: один переключатель, весь файл офлайн,
   системную схему не слушаем — на вокзале свет меняется чаще настроек */
function isDark(){ return document.documentElement.dataset.theme === 'dark'; }

function toggleTheme(){
  const dark = !isDark();
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', dark ? '#131211' : '#f1f0ee');
  say(dark ? 'Тёмная тема включена' : 'Светлая тема включена');
}

/* ============================================================================
   ВИБРАЦИЯ

   Вибрация здесь — голос приложения, а не эхо нажатия. Пассажир видит,
   что кнопка нажалась; жужжать ему в ответ незачем. Дрожит телефон только
   на новостях: билет прочитан, носильщик назначен, носильщик пришёл,
   багаж принят, багаж донесён, оценка ушла.

   Рисунка два, и они различимы в кармане на слух: короткий двойной —
   «принято, идём дальше», длинный тройной — «к вам пришли, посмотрите».

   navigator.vibrate работает в браузерах на Android и отсутствует
   в Safari на iPhone. Там переключать нечего, поэтому строка в кабинете
   гаснет и говорит об этом прямо.
   ========================================================================= */

const CAN_BUZZ = typeof navigator.vibrate === 'function';
let buzzOn = CAN_BUZZ;

const BUZZ = {
  tap:  14,                        /* проба при включении */
  ok:   [0, 16, 60, 16],           /* принято */
  meet: [0, 34, 120, 34, 120, 60]  /* к вам пришли */
};

function buzz(kind){
  if(!buzzOn) return;
  /* Firefox с выключенным dom.vibrator бросает исключение — заказ из-за
     тактильной мелочи падать не должен. */
  try{ navigator.vibrate(BUZZ[kind]); }catch(e){}
}

         'Код: ' + code + '.\n' +
         'Дальше — ' + destName().toLowerCase() + '.';
}

async function doShare(){
  const text = shareText();
  if(navigator.share){
    try{ await navigator.share({ title:'Носильщик', text:text }); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(text); say('Данные заказа скопированы'); }
  catch(e){ say(text); }
}

       'Всё в границах одного вокзала — за его пределы не выходит.' };

const NOTE_OUT = { title:'Выход', head:'Выход из аккаунта',
  text:'В прототипе аккаунт один, данные в нём захардкожены — выходить некуда.' };

const NOTE_PAY = { title:'Оплата', head:'Способ оплаты',
  text:'Списываем с карты после подтверждения «Получил багаж», чаевые — отдельно. ' +
       'В прототипе карта показана для примера.' };

/* ============================================================================
   СОБЫТИЯ ГЛАВНОЙ
   ========================================================================= */

/* Заказ уже идёт — ведём в него, а не начинаем второй.
   Билет уже распознан — сразу к зоне и багажу: просить отсканировать
   второй раз тот же билет незачем. */
function openPorter(){
  if(state.stage === 'searching') return openPage('search');
  if(state.stage !== 'idle')      return openPage('order');
  openPage(state.trip ? 'form' : 'ticket');
}

$('ava-btn').addEventListener('click', () => openPage('me'));
$('go-history').addEventListener('click', () => openPage('history'));
$('go-me').addEventListener('click', () => openPage('me'));
$('active').addEventListener('click', openPorter);
$('call-btn').addEventListener('click', openPorter);

$('last').addEventListener('click', (e) => {
  if(!e.target.closest('[data-act="past"]')) return;
  openPage('past', 0);
});

$('st-cards').addEventListener('click', (e) => {
  const card = e.target.closest('[data-st]');
  if(card) openSheet('stinfo', card.dataset.st);
});

/* ============================================================================
   ДЕЙСТВИЯ. Один делегированный обработчик на экран и на шит: содержимое
   перерисовывается целиком, поэтому слушатель на каждой кнопке был бы
   источником утечек.
   ========================================================================= */

$('page-back').addEventListener('click', backPage);
$('sheet-close').addEventListener('click', closeSheet);
$('sheet-back').addEventListener('click', backSheet);

$('sheet-body').addEventListener('scroll', sheetEdge, { passive:true });
$('sheet-body').addEventListener('load', sheetEdge, true);

function onAct(e){
  if(e.target.closest('[data-close]')) return closeSheet();

  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const act = el.dataset.act;

  /* --- шаг 1: билет --- */
  if(act === 'scan')   return applyTicket(DEMO_TICKET);
  if(act === 'manual') { clearTimeout(scanTimer); return pushPage('manual'); }

  if(act === 'demo-ticket'){
    const f = $('tk');
    f.value = (el.dataset.t || DEMO_TICKET).replace(/(\d{4})(?=\d)/g, '$1 ');
    checkManual();
    return;
  }
  if(act === 'read-manual') return applyTicket($('tk').value);

  /* --- шаг 2: зона и багаж на одном экране --- */
  if(act === 'zone'){
    state.zone = el.dataset.id;
    /* выбор применяется на месте: галочка переезжает, цена и маршрут
       пересчитываются — экран не подменяется */
    $('page-body').querySelectorAll('.check').forEach(c => c.classList.remove('on'));
    el.querySelector('.check').classList.add('on');
    renderBags();
    return;
  }

  if(act === 'zone-map')  return pushSheet('zmap');

  if(act === 'cmnt') return pushSheet('cmnt');

  /* Подсказка не галочка, а заготовка текста: дописываем и отдаём поле человеку */
  if(act === 'note-add'){
    const ta = $('note-ta'), t = el.dataset.t;
    const has = ta.value.trim().replace(/[,.\s]+$/, '');
    ta.value = has ? has + ', ' + t.toLowerCase() : t;
    ta.focus();
    return;
  }

  if(act === 'note-save'){
    state.note = $('note-ta').value.trim();
    closeSheet();
    return paintPage();
  }

  if(act === 'zone-done'){
    closeSheet();
    return paintPage();          /* вернулись на форму — цена уже новая */
  }

  if(act === 'when'){
    state.when = el.dataset.id;
    renderBags();
    /* «Ко времени» без минуты — пустое обещание, поэтому сетка открывается
       сразу и повторным нажатием, когда минуту хотят поменять. */
    if(state.when === 'time') return pushSheet('when');
    return;
  }

  if(act === 'slot'){
    state.when = 'time';
    state.atTime = el.dataset.t;
    closeSheet();
    return paintPage();
  }

  if(act === 'size'){ state.size = el.dataset.id; return renderBags(); }
  if(act === 'bag-plus'){  state.bags = Math.min(6, state.bags + 1); return renderBags(); }
  if(act === 'bag-minus'){ state.bags = Math.max(1, state.bags - 1); return renderBags(); }
  if(act === 'call') return startSearch();

  /* --- жизненный цикл --- */
  if(act === 'cancel')   return cancelOrder();
  if(act === 'handover') return handOver();
  if(act === 'finish')   return finishOrder();

  /* Демо: мгновенный переход на следующую стадию вместо ожидания таймера */
  if(act === 'skip'){
    clearInterval(tickTimer);
    if(state.stage === 'assigned') return arrive();
    if(state.stage === 'picked')   return deliver();
    return;
  }

  /* --- оценка --- */
  if(act === 'star'){
    state.stars = +el.dataset.n;
    renderStars();
    /* каскад: звёзды загораются одна за другой */
    $('stars').querySelectorAll('button.on').forEach((b, i) =>
      setTimeout(() => replay(b, 'pop'), i * 55));
    return renderSendBtn();
  }

  if(act === 'mark'){
    const nm = el.dataset.name;
    const i = state.marks.indexOf(nm);
    if(i > -1) state.marks.splice(i, 1); else state.marks.push(nm);
    renderMarks();
    const again = $('tags').querySelector('[data-name="' + nm + '"]');
    if(i === -1) replay(again, 'pop');
    return;
  }

  if(act === 'tip'){ state.tip = +el.dataset.t; renderTips(); return renderSendBtn(); }
  if(act === 'send') return submitRating();

  /* --- связь и навигация --- */
  if(act === 'share')   return doShare();
  if(act === 'phone')   return pushSheet('note', notePhone());
  if(act === 'chat')    return pushSheet('note', noteChat());
  if(act === 'support') return pushSheet('note', NOTE_SUPPORT);
  if(act === 'pay')     return pushSheet('note', NOTE_PAY);
  if(act === 'rules')   return pushSheet('note', NOTE_RULES);
  if(act === 'signout') return pushSheet('note', NOTE_OUT);

  if(act === 'go')       return pushPage(el.dataset.to);
  if(act === 'past')     return pushPage('past', el.dataset.i);

  /* Тёмная тема — переключателем в кабинете, а не системной настройкой */
  if(act === 'theme'){ toggleTheme(); return paintPage(); }

  /* Включили — сразу почувствовали: переключатель обязан показать,
     что именно он включает. */
  if(act === 'buzz'){
    buzzOn = !buzzOn;
    buzz('tap');
    say(buzzOn ? 'Вибрация включена' : 'Вибрация выключена');
    return paintPage();
  }

  if(act === 'home')  return goHome();
  if(act === 'back')  return backSheet();
  if(act === 'close') return closeSheet();
}

$('page').addEventListener('click', onAct);
$('sheet').addEventListener('click', onAct);

/* Кнопка «Найти рейс» активна, только когда номер похож на настоящий */
function checkManual(){
  const f = $('tk'), btn = document.querySelector('[data-act="read-manual"]');
  if(!f || !btn) return;
  btn.disabled = f.value.replace(/\D/g, '').length < 14;
}

$('page').addEventListener('input', (e) => {
  if(e.target.id === 'tk') checkManual();
});

/* Escape ведёт себя как стрелка «назад»: сначала закрывает шит,
   потом отступает по экранам, последним шагом — на главную */
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(!$('sheet').hidden) return backSheet();
  if(!$('page').hidden)  return backPage();
});

/* ============================================================================
   СТАРТ
   ========================================================================= */

renderHome();
</script>
</body>
</html>
