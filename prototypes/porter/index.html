<title>Носильщик</title>

<!--
  Носильщик — заказ носильщика на вокзале.
  Один файл, без сборщиков и CDN: открывается двойным кликом, работает офлайн.
  Данные захардкожены — бэкенда нет.

  Структура: главная-витрина (сетка багажных сервисов) + боттом-шиты на шаги.
  Нижних вкладок нет: главная это хаб, из любого шита есть путь назад.

  Карты вокзала здесь принципиально нет. Подробная план-схема объекта
  транспортной инфраструктуры — часть плана обеспечения транспортной
  безопасности и оценки уязвимости, это сведения ограниченного доступа
  (ФЗ-16 «О транспортной безопасности», ст. 5 ч. 8 и ст. 9; ПП РФ № 2201
  от 21.12.2020). Вместо карты — маршрутная лента: последовательность
  именованных точек обслуживания с фото-ориентирами, без геометрии здания.
-->

/* ============================================================================
   ТОКЕНЫ
   ========================================================================= */
:root{
  --bg:#f3f0ea;
  --surface:#fdfaf3;         /* тёплый айвори: чистый белый рядом с рисунками
                                читается как лист другого сорта бумаги */
  --surface-2:#f4f0e8;
  --ink:#221f1a;
  --ink-2:#7d7568;
  --line:#ece6db;

  --yellow:#fce000;          /* только кнопки действия, больше нигде */
  /* Тот же жёлтый, но со светом сверху: плоская заливка на большой площади
     выглядит наклейкой, подсвеченная — предметом. */
  --yellow-lit:linear-gradient(168deg, #ffe93f 0%, #fce000 46%, #f2d200 100%);
  --yellow-cast:rgba(176,154,0,.42);   /* тень жёлтого — тёплая, не серая */
  --yellow-ink:#21201f;      /* текст на жёлтом: тёмный в обеих темах */
  --sand:#f2e4d0;            /* подложка плиток — кремовый фон рисунков вокзалов */
  --sand-fg:#241f16;         /* текст на песочном: не темнеет вместе с темой */
  --sand-ink:#7f7053;        /* вторичный текст на песочном */
  --photo:#e6ded1;           /* слот, куда ещё не положили фотографию */
  --photo-ink:#7a7266;

  /* Инверсия — единственный способ показать «выбрано» без второго акцента */
  --invert:#21201f;
  --invert-ink:#ffffff;

  --r-sheet:28px;
  --r-hero:26px;             /* билет скруглён сильнее прочего */
  --r-card:20px;
  --r-btn:16px;
  --r-inner:14px;
  --r-pill:999px;

  /* Глубина двумя ступенями, а не одна на всех: билет — сцена экрана,
     обычные карточки едва оторваны от бумаги. Выбранное состояние
     тень теряет: выбранное лежит, невыбранное лежит выше.
     Каждая ступень собрана из трёх слоёв — контакт у самого края, ближний
     ореол и дальний рассеянный. Одна тень читается обводкой, три — высотой. */
  --shadow-card:
    0 1px 2px rgba(33,32,31,.05),
    0 5px 12px -6px rgba(33,32,31,.10),
    0 18px 34px -20px rgba(33,32,31,.22);
  --shadow-hero:
    0 1px 3px rgba(20,19,17,.10),
    0 10px 22px -12px rgba(20,19,17,.26),
    0 34px 56px -26px rgba(20,19,17,.46);

  /* Стекло. Шапка и док не закрашивают ленту, а размывают её: под ними
     видно, что содержимое продолжается, и полоса перестаёт быть краем. */
  --glass:rgba(241,240,238,.72);
  --glass-line:rgba(33,32,31,.07);
  --blur:saturate(1.8) blur(20px);

  /* Свет сверху на самом фоне: страница перестаёт быть ровным листом */
  --bg-lit:#fdfbf6;

  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:'Manrope','Onest','Golos Text','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}

/* ----------------------------------------------------------------------------
   ТЁМНАЯ ТЕМА. Включается вручную из кабинета, а не системой: пассажир
   на вокзале сам решает, что ему сейчас читать удобнее.
   Жёлтый и песочный не трогаем — это фирменные цвета, они узнаются
   и в темноте. Тени в темноте не работают, глубину даёт светлота.
   ------------------------------------------------------------------------- */
html[data-theme="dark"]{
  --bg:#141210;
  --surface:#201d19;
  --surface-2:#2c2823;
  --ink:#f5f1e9;
  --ink-2:#9c9385;
  --line:#332e27;

  /* Песочный не темнеет: это фон самих рисунков вокзалов, вшитых в файл.
     Затемнить подложку — значит наклеить светлый прямоугольник на тёмный
     экран. Карточки вокзалов остаются тёплыми пятнами, и это к лучшему. */
  --photo:#2c2823;
  --photo-ink:#807769;

  --invert:#f4f2ee;          /* инверсия переворачивается вместе с темой */
  --invert-ink:#141312;

  --shadow-card:0 0 0 1px rgba(255,255,255,.055);
  --shadow-hero:0 0 0 1px rgba(255,255,255,.09), 0 24px 44px -24px #000;

  --yellow-cast:rgba(252,224,0,.14);   /* в темноте жёлтый не льёт тень, а светит */
  --glass:rgba(19,18,17,.72);
  --glass-line:rgba(255,255,255,.08);
  --bg-lit:#1d1a15;
}

/* Гасим только те рисунки, что лежат прямо на чёрном листе: их собственный
   светлый фон в темноте светится ярче всего на экране. Вокзалы, тележку и
   значки зон не трогаем — под ними своя кремовая или жёлтая подложка, и на
   ней притушенный рисунок выглядит грязным, а не спокойным. */
html[data-theme="dark"] .tile__photo{ filter:brightness(.95) saturate(.97); }
/* Карточку вокзала гасим целиком, вместе с кремовой подложкой: погасить
   один рисунок на светлой подложке — получить грязное пятно в светлой рамке. */
html[data-theme="dark"] .stile{ filter:brightness(.9) saturate(.96); }

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* Классы блоков задают display, поэтому атрибут hidden сам по себе
   их не прячет — возвращаем ему силу. */
[hidden]{ display:none !important; }

html{ background:var(--bg); }

body{
  font-family:var(--sans);
  background:radial-gradient(140% 52% at 50% 0%, var(--bg-lit) 0%, transparent 62%), var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-size:15px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

button, input{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; text-align:left; }

.nums{ font-variant-numeric:tabular-nums; }

.sr-only{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Заглушка под фотографию: ровная заливка, никаких самодельных иллюстраций */
.ph{
  background:var(--photo);
  color:var(--photo-ink);
  display:grid; place-items:center; text-align:center;
  font-size:11px; font-weight:600; letter-spacing:.02em;
  overflow:hidden; flex:none;
}

/* ============================================================================
   КАРКАС
   ========================================================================= */
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:0 16px calc(28px + env(safe-area-inset-bottom));
}

/* Шапка здоровается и показывает контекст поездки, а не название приложения:
   имя продукта на своём же экране пассажиру ничего не сообщает. */
.head{
  display:flex; align-items:center; gap:12px;
  padding:calc(16px + env(safe-area-inset-top)) 2px 16px;
}
.head__hi{
  font-size:30px; font-weight:800; letter-spacing:-.035em;
}

.ava{
  width:44px; height:44px; flex:none; margin-left:auto;
  border-radius:var(--r-pill);
  background:var(--invert); color:var(--invert-ink);
  display:grid; place-items:center;
  font-size:13px; font-weight:700; letter-spacing:.02em;
  box-shadow:var(--shadow-card);
}
.ava:active{ transform:scale(.94); }

.feed{ display:flex; flex-direction:column; gap:14px; }

.h2{
  font-size:23px; font-weight:800; letter-spacing:-.035em;
  margin:10px 0 -10px;
}
.note{ font-size:13.5px; line-height:1.45; color:var(--ink-2); margin-bottom:-4px; }

/* ----------------------------------------------------------------------------
   ПЛИТКИ. Действие — широкое и жёлтое, разделы — два равных квадрата.
   Три плитки вместо списка: их видно целиком, без чтения строк.
   ------------------------------------------------------------------------- */
.tiles3{ display:grid; grid-template-columns:1fr 1fr; gap:12px 8px; }

.tile{
  position:relative;
  display:flex; flex-direction:column; align-items:flex-start;
  gap:2px; padding:14px;
  min-height:104px;
  background:var(--surface); border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  text-align:left;
  transition:transform .16s var(--ease);
}
.tile:active{ transform:scale(.97); }

/* Иконка живёт в своей плашке — так плитка читается как карточка сервиса,
   а не как строка списка с картинкой слева */
.tile__ic{
  margin-bottom:auto; color:var(--ink);
  width:38px; height:38px; border-radius:12px;
  background:var(--surface-2);
  display:grid; place-items:center;
}
.tile__nm{ font-size:15px; font-weight:700; letter-spacing:-.025em; }
.tile__sub{ font-size:12.5px; color:var(--ink-2); }

/* История и кабинет — карточки из макета целиком: подпись нарисована внутри,
   поэтому у плитки нет ни отступов, ни своей заливки. Половина ряда: разделы
   не должны спорить по весу с жёлтой кнопкой заказа. */
.tile--hist,
.tile--card{
  padding:0; background:none; overflow:hidden;
  /* пропорции карточки из макета: она занимает плитку целиком, без полей
     и без обрезки — обе картинки приведены к одной форме */
  min-height:0; aspect-ratio:505 / 292;
}
.tile--hist > span,
.tile--card > span{ display:block; width:100%; height:100%; }
.tile__photo{ display:block; width:100%; height:100%; object-fit:cover; }

/* Главное действие: широкая жёлтая плитка со сценой услуги */
.tile--go{
  grid-column:1 / -1;
  min-height:0;
  background:var(--yellow-lit); color:var(--yellow-ink);
  box-shadow:0 1px 2px rgba(33,32,31,.06), 0 8px 18px -8px var(--yellow-cast),
             0 24px 40px -22px var(--yellow-cast);
  padding:22px 8px 22px 22px;
  flex-direction:row; align-items:center; gap:14px;
}
.tile__txt{ min-width:0; display:flex; flex-direction:column; gap:4px; }
.tile--go .tile__nm{ font-size:21px; font-weight:800; letter-spacing:-.032em; }
/* «подача от 10 мин · от 350 ₽» отвечает на два главных вопроса сразу —
   бледнее основной подписи она быть может, полупрозрачной нет */
.tile--go .tile__sub{ font-size:13.5px; color:rgba(33,32,31,.76); font-weight:600; }
.tile__art{ flex:none; width:104px; color:var(--ink); }
/* Свободное место справа от подписи делится поровну — тележка встаёт по
   центру между концом текста и краем плитки */
.tile--go .tile__art{ color:var(--yellow-ink); width:auto; margin-inline:auto; }
.tile__art svg{ display:block; width:100%; height:auto; }
/* Тележка стоит вплотную к подписи и выходит за отступы плитки: объёмный
   предмет на плоской заливке читается как предмет, а не как иконка в рамке.
   Текст не растягивается на всю ширину — иначе рисунок уезжает к краю. */
.tile__cart{ display:block; height:150px; width:auto; margin:-20px -2px -22px 0; }

/* ----------------------------------------------------------------------------
   ВТОРОЙ ЭКРАН. Заказ, кабинет и история — полноценные экраны со своей шапкой,
   а не шторки: у длинного шага должен быть свой адрес и своя стрелка назад.
   ------------------------------------------------------------------------- */
.page{ animation:pageIn .22s var(--ease); }
@keyframes pageIn{ from{ opacity:0; transform:translateX(14px); } }

.phead{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:6px;
  margin:0 -16px; padding:calc(8px + env(safe-area-inset-top)) 10px 10px;
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:0 1px 0 var(--glass-line);
}
.phead__nav{
  width:38px; height:38px; flex:none;
  display:grid; place-items:center; border-radius:var(--r-pill);
  color:var(--ink);
}
.phead__nav:active{ background:var(--surface-2); }
.phead__t{ font-size:19px; font-weight:800; letter-spacing:-.03em; }

/* Док прижат к низу экрана и повторяет ширину приложения: кнопка действия
   не должна уезжать под сгиб длинной формы. */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:6;
  max-width:480px; margin:0 auto;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:0 -1px 0 var(--glass-line);
  display:flex; flex-direction:column; gap:8px;
}
.page:has(.dock:not([hidden])) .feed{ padding-bottom:96px; }

/* Переключатель. Единственное место, где допустим жёлтый не на кнопке:
   включённое состояние — это и есть действие, просто уже совершённое. */
.sw{
  margin-left:auto; flex:none;
  width:44px; height:26px; border-radius:var(--r-pill);
  background:var(--surface-2); position:relative;
  transition:background .18s var(--ease);
}
.sw i{
  position:absolute; top:3px; left:3px;
  width:20px; height:20px; border-radius:var(--r-pill);
  background:var(--surface); box-shadow:0 1px 3px rgba(20,19,17,.28);
  transition:transform .18s var(--ease);
}
.sw.on{ background:var(--yellow); }
.sw.on i{ transform:translateX(18px); background:#fff; }

/* --- плашка активного заказа --- */
.active{
  display:flex; align-items:center; gap:12px;
  width:100%;
  padding:10px 14px 10px 10px;
  background:var(--surface);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  animation:drop .4s var(--ease) both;
}
.active:active{ transform:scale(.985); }

.active__face{
  width:46px; height:46px; flex:none;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  overflow:hidden;
}
.active__face img, .active__face svg{
  width:100%; height:100%; display:block; object-fit:cover;
}
.active__face--l{ width:56px; height:56px; }
.face__ini{
  display:grid; place-items:center; width:100%; height:100%;
  font-size:17px; font-weight:700; color:var(--ink-2);
}

.active__body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.active__name{ font-size:15px; font-weight:700; letter-spacing:-.02em; }
.active__sub{
  font-size:13px; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.active__eta{ flex:none; text-align:right; font-size:17px; font-weight:800; letter-spacing:-.02em; }
.active__eta small{ display:block; font-size:11px; font-weight:600; color:var(--ink-2); letter-spacing:0; }

@keyframes drop{
  from{ opacity:0; transform:translateY(-10px); }
  to{ opacity:1; transform:none; }
}

/* ----------------------------------------------------------------------------
   ГДЕ РАБОТАЕМ. Лента из трёх вокзалов: не выбор, а ответ на вопрос
   «а у вас вообще где это есть». Подложка плитки совпадает с фоном рисунка,
   поэтому картинка не наклеена сверху, а лежит внутри карточки.
   ------------------------------------------------------------------------- */
/* Лента, а не столбик: три вокзала — это ответ на вопрос «а где вы есть»,
   он не должен занимать целый экран прокрутки. Карточка заметно уже кнопки
   заказа: карточка во всю ширину вырастала выше главного действия, и самым
   крупным пятном экрана становился справочник, а не то, зачем сюда пришли. */
.stations{
  display:grid; grid-auto-flow:column; grid-auto-columns:63%;
  gap:12px;
  overflow-x:auto; scroll-snap-type:x mandatory;
  margin:0 -16px; padding:2px 16px 6px;
  scrollbar-width:none;
}
.stations::-webkit-scrollbar{ display:none; }
.stations > *{ scroll-snap-align:center; }

.stile{
  display:flex; flex-direction:column;
  background:var(--sand); color:var(--sand-fg);
  border-radius:var(--r-hero); overflow:hidden;
  text-align:left;
  box-shadow:var(--shadow-card);
  transition:transform .16s var(--ease);
}
.stile:active{ transform:scale(.985); }

.stile__art{
  display:block; width:100%; aspect-ratio:2.2/1;
  object-fit:contain; object-position:center bottom;
  background:var(--sand);
}
.stile__txt{ padding:10px 14px 14px; }
.stile__nm{
  display:block; font-size:17px; font-weight:800; letter-spacing:-.03em;
}
.stile__sub{ display:block; font-size:13px; color:var(--sand-ink); margin-top:2px; }

/* Текущий вокзал помечаем словом, а не галочкой: галочка ничего не объясняет.
   На песочном фоне отметка всегда тёмная — тема её не переворачивает. */
.stile__here{
  display:inline-block; margin-top:7px;
  padding:4px 10px; border-radius:var(--r-pill);
  background:var(--sand-fg); color:var(--sand);
  font-size:11.5px; font-weight:600; letter-spacing:.01em;
}
.stile .check{ background:rgba(33,31,22,.12); }
.stile .check.on{ background:var(--sand-fg); color:var(--sand); }

/* Шапка шита вокзала — та же плитка, только во всю ширину */
.shead{
  background:var(--sand); color:var(--sand-fg);
  border-radius:var(--r-card); overflow:hidden;
}
.shead__art{
  display:block; width:100%; aspect-ratio:2.4/1;
  object-fit:contain; object-position:center bottom;
  background:var(--sand);
}
.shead__txt{ padding:4px 16px 15px; }
.shead__txt b{ display:block; font-size:18px; font-weight:800; letter-spacing:-.03em; }
.shead__txt small{ display:block; font-size:13px; color:var(--sand-ink); margin-top:2px; }

/* --- список-меню --- */
.list{
  background:var(--surface); border-radius:var(--r-card); overflow:hidden;
  box-shadow:var(--shadow-card);
}
.li{
  display:flex; align-items:center; gap:10px;
  width:100%; padding:15px 14px;
  font-size:15px; font-weight:500;
  border-bottom:1px solid var(--line);
}
.li:last-child{ border-bottom:0; }
.li:active{ background:var(--surface-2); }
.li .meta{ margin-left:auto; color:var(--ink-2); font-size:14px; font-weight:400; }
/* Выход не действие дня: он замыкает экран, а не зовёт на себя нажать */
.li--quiet{ color:var(--ink-2); font-weight:600; justify-content:center; }
.li .chev{ color:var(--ink-2); display:grid; place-items:center; }

/* ============================================================================
   БОТТОМ-ШИТ
   ========================================================================= */
.sheet{ position:fixed; inset:0; z-index:20; }
.sheet[hidden]{ display:none; }

.sheet__scrim{
  position:absolute; inset:0;
  background:rgba(20,19,17,.42);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  animation:fade .22s var(--ease) both;
}
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

.sheet__win{
  position:absolute; left:0; right:0; bottom:0;
  max-width:480px; margin:0 auto;
  max-height:92dvh;
  display:flex; flex-direction:column;
  background:var(--bg);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:0 -1px 0 var(--glass-line) inset, 0 -6px 16px rgba(20,19,17,.10), 0 -22px 54px rgba(20,19,17,.22);
  animation:rise .3s var(--ease) both;
  overflow:hidden;
}
@keyframes rise{ from{ transform:translateY(100%); } to{ transform:none; } }

.sheet__head{
  display:grid; grid-template-columns:36px 1fr 36px; align-items:center;
  gap:8px; padding:14px 12px 8px; flex:none;
}
.sheet__head h3{
  grid-column:2; text-align:center;
  font-size:16px; font-weight:800; letter-spacing:-.02em;
}
.sheet__nav{
  width:36px; height:36px;
  display:grid; place-items:center;
  border-radius:var(--r-pill); color:var(--ink);
}
.sheet__nav:active{ background:var(--surface-2); }
.sheet__nav.off{ visibility:hidden; }

.sheet__body{
  flex:1; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:12px;
  scrollbar-width:none;
}
.sheet__body::-webkit-scrollbar{ display:none; }

/* Полосы прокрутки на телефоне нет, а знать, что лента не кончилась, надо.
   Нижний край гаснет, пока не долистали до конца: размытый край — значит
   там ещё есть, ровный — значит всё. */
.sheet__body--more{
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 44px), transparent);
  mask-image:linear-gradient(to bottom, #000 calc(100% - 44px), transparent);
}
/* Содержимое шита прокручивается, а не ужимается: без этого флекс сплющивал
   блоки под высоту экрана и от фото вокзала оставалась полоска. */
.sheet__body > *{ flex:none; }

.sheet__foot{
  flex:none;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:6px;
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:0 -1px 0 var(--glass-line);
}
.sheet__foot[hidden]{ display:none; }

@media (prefers-reduced-motion:reduce){
  .sheet__win, .sheet__scrim, .active{ animation:none; }
}
/* ============================================================================
   СОДЕРЖИМОЕ ШИТОВ
   ========================================================================= */
.card{
  background:var(--surface); border-radius:var(--r-card); padding:14px;
  box-shadow:var(--shadow-card);
}
.card--flat{ padding:0; overflow:hidden; }

.group{
  font-size:13px; font-weight:700; color:var(--ink-2);
  letter-spacing:-.01em; margin:2px 0 -6px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}

/* Второстепенное действие в заголовке блока — «Карта зон» */
.group__act{
  font-size:13px; font-weight:600; color:var(--ink);
  padding:5px 11px; border-radius:var(--r-pill);
  background:var(--surface-2);
}
.group__act:active{ transform:scale(.96); }

.lead{ font-size:14px; color:var(--ink-2); }

/* --- плашка билета: тёмная, не жёлтая --- */
.pass{
  background:linear-gradient(158deg,
    color-mix(in srgb, var(--invert) 86%, var(--invert-ink)) 0%, var(--invert) 56%);
  color:var(--invert-ink);
  border-radius:var(--r-hero);
  padding:16px;
  box-shadow:var(--shadow-hero);
}
.pass__top{ display:flex; align-items:baseline; gap:8px; }
.pass__train{ font-size:17px; font-weight:800; letter-spacing:-.03em; }
.pass__way{ font-size:13px; opacity:.62; margin-top:2px; }
.pass__tear{
  height:1px; margin:13px -16px;
  background:repeating-linear-gradient(90deg,color-mix(in srgb, var(--invert-ink) 30%, transparent) 0 6px,transparent 6px 12px);
}
.pass__grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pass__grid b{ display:block; font-size:19px; font-weight:800; letter-spacing:-.03em; }
.pass__grid span span{ display:block; font-size:11px; opacity:.6; margin-top:1px; }

/* --- сканер билета --- */
.scan{
  position:relative;
  aspect-ratio:1.55 / 1;
  background:var(--photo);
  border-radius:var(--r-card);
  overflow:hidden;
  display:grid; place-items:center;
  width:100%;
}
.scan__hint{
  font-size:12px; font-weight:600; color:var(--photo-ink);
  padding:0 32px; text-align:center;
}
.scan__frame{
  position:absolute; inset:16px;
  border-radius:var(--r-inner);
}
.scan__frame i{
  position:absolute; width:22px; height:22px;
  border:2.5px solid var(--ink); opacity:.7;
}
.scan__frame i:nth-child(1){ top:0; left:0; border-right:0; border-bottom:0; border-radius:8px 0 0 0; }
.scan__frame i:nth-child(2){ top:0; right:0; border-left:0; border-bottom:0; border-radius:0 8px 0 0; }
.scan__frame i:nth-child(3){ bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 8px; }
.scan__frame i:nth-child(4){ bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 8px 0; }
.scan__line{
  position:absolute; left:18px; right:18px; height:2px;
  background:var(--ink); opacity:.55; border-radius:2px;
  animation:scanline 1.9s var(--ease) infinite;
}
@keyframes scanline{
  0%{ top:18%; opacity:0; }
  15%{ opacity:.55; }
  85%{ opacity:.55; }
  100%{ top:82%; opacity:0; }
}
.scan:active{ transform:scale(.99); }

/* Экран сканера ставим по центру: наверху он оставлял под собой пустой
   экран, а камера в любом приложении смотрит из середины. */
.mid{
  flex:1; min-height:calc(100dvh - 96px);
  display:flex; flex-direction:column; justify-content:center; gap:14px;
}

/* Что именно читаем из билета — три подписи вместо перечисления в строку:
   список глазом не читается, а три слова видно сразу. */
.reads{ display:flex; flex-direction:column; gap:6px; align-items:center; }
.reads__t{ font-size:12px; color:var(--ink-2); }
.reads__l{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
.reads__l b{
  font-size:12px; font-weight:600; letter-spacing:-.01em;
  padding:6px 12px; border-radius:var(--r-pill);
  background:var(--surface); color:var(--ink);
  box-shadow:var(--shadow-card);
}

/* --- поле ручного ввода --- */
.field{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border-radius:var(--r-btn);
  height:52px; padding:0 14px;
}
.field input{
  flex:1; min-width:0; border:0; outline:0; background:none;
  font-size:17px; font-weight:600; letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.field input::placeholder{ color:var(--ink-2); font-weight:400; letter-spacing:.02em; }

.ta{
  width:100%; resize:none; border:0; outline:0;
  background:var(--surface); border-radius:var(--r-card);
  padding:14px 16px; box-shadow:var(--shadow-card);
  font:inherit; font-size:15px; line-height:1.4; color:var(--ink);
}
.ta::placeholder{ color:var(--ink-2); }

.linkbtn{
  align-self:center;
  font-size:14px; font-weight:600; color:var(--ink-2);
  padding:8px 4px; text-decoration:underline; text-underline-offset:3px;
}
.linkbtn:active{ color:var(--ink); }

/* --- строка-вариант (зоны, вокзалы, размеры) --- */
.rows{
  background:var(--surface); border-radius:var(--r-card); overflow:hidden;
  box-shadow:var(--shadow-card);
}
.row{
  display:flex; align-items:center; gap:12px;
  width:100%; padding:10px 14px 10px 10px;
  border-bottom:1px solid var(--line);
}
.row:last-child{ border-bottom:0; }
.row:active{ background:var(--surface-2); }

/* Иконка вместо снимка: фотография уместна там, где она сама и есть
   содержание (зона передачи, вокзал). В служебных строках
   серый прямоугольник — это дырка в макете, а не изображение. */
.row__ic{
  width:42px; height:42px; flex:none;
  border-radius:var(--r-inner);
  background:var(--surface-2); color:var(--ink);
  display:grid; place-items:center;
}
/* Объёмный предмет несёт свою форму и тень — серая плашка под ним
   превращает его в значок в рамке, поэтому под картинкой заливку снимаем. */
.ic3d{ width:100%; height:100%; display:block; }
.row__ic.is-art, .zmap__ic.is-art{ background:none; }
/* Вокзал — исключение: у него есть свой рисунок, и он узнаётся быстрее названия */
.row__art{
  width:56px; height:42px; flex:none;
  border-radius:var(--r-inner);
  background:var(--sand);
  object-fit:contain; object-position:center bottom;
}
.row__dot{
  width:8px; height:8px; flex:none; margin:0 17px;
  border-radius:var(--r-pill); background:var(--ink-2);
}
.row__dot--to{ border-radius:2px; background:var(--invert); }
.row__body{ flex:1; min-width:0; }
.row__value{ display:block; font-size:15px; font-weight:600; letter-spacing:-.01em; }
.row__label{ display:block; font-size:12.5px; color:var(--ink-2); margin-top:1px; }
.row__extra{ flex:none; font-size:14px; font-weight:600; color:var(--ink-2); }
/* Шаги пронумерованы не для красоты: порядок обязателен — код называют
   после встречи, а встреча возможна только по билету. */
.row__n{ font-size:15px; font-weight:800; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.row__chev{ flex:none; color:var(--ink-2); display:grid; place-items:center; }

.check{
  width:22px; height:22px; flex:none;
  border-radius:var(--r-pill);
  display:grid; place-items:center;
  background:var(--surface-2); color:transparent;
}
.check.on{ background:var(--invert); color:var(--invert-ink); }

/* --- выбор типа багажа ---------------------------------------------------
   Три карточки в ряд, а не лентой: вариантов всего три, прятать треть выбора
   за краем экрана незачем. Предметы вырезаны из плиток макета и поставлены
   на общую линию — рюкзак ниже чемодана, чемодан ниже ящика, и ряд читается
   как шкала веса ещё до подписей. */
.sizes{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }

.size{
  display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:10px 6px 12px;
  background:var(--surface); border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  transition:box-shadow .22s var(--ease), transform .16s var(--ease);
  animation:sizeIn .42s var(--ease) backwards;
}
.size:nth-child(2){ animation-delay:.07s; }
.size:nth-child(3){ animation-delay:.14s; }
@keyframes sizeIn{ from{ opacity:0; transform:translateY(12px); } }
.size:active{ transform:scale(.96); }

/* Рисунок живёт в своём окне и выходит за его край при выборе: предмет
   приподнимается, а карточка остаётся на месте. */
.size__box{ display:block; width:100%; height:62px; }
.size__art{
  display:block; width:100%; height:100%;
  object-fit:contain; object-position:center bottom;
  filter:drop-shadow(0 5px 7px rgba(33,32,31,.20));
  transition:transform .34s cubic-bezier(.34,1.5,.6,1), filter .34s var(--ease);
}
.size__nm{ font-size:12.5px; font-weight:700; letter-spacing:-.02em; text-align:center; }
.size__kg{ font-size:11px; color:var(--ink-2); }

.size[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--invert), var(--shadow-card); }
.size[aria-pressed="true"] .size__art{
  transform:translateY(-5px) scale(1.09);
  filter:drop-shadow(0 10px 12px rgba(33,32,31,.24));
}

@media (prefers-reduced-motion:reduce){
  .size{ animation:none; }
  .size__art{ transition:none; }
}

/* --- степпер --- */
.stepper__ctl{
  display:flex; align-items:center; gap:2px; flex:none;
  background:var(--surface); border-radius:var(--r-pill);
  padding:2px; box-shadow:var(--shadow-card);
}
.stepper__ctl button{
  width:28px; height:28px; border-radius:var(--r-pill);
  color:var(--ink); display:grid; place-items:center;
  font-size:19px; font-weight:600; line-height:1;
}
.stepper__ctl button:disabled{ opacity:.3; }
.stepper__ctl button:active:not(:disabled){ transform:scale(.9); }
/* --- поиск носильщика: радар ---------------------------------------------

   Это не карта и не схема вокзала: ни одна точка на нём ничего не значит.
   Радар отвечает на единственный вопрос ожидающего человека — «оно вообще
   работает?» — и отвечает движением, потому что текстом на это не ответишь.
   Поэтому и живёт он ровно те секунды, пока идёт поиск. */
.radar{
  position:relative; height:214px;
  border-radius:18px; overflow:hidden;
  background:radial-gradient(90% 90% at 50% 46%, var(--surface) 0%, var(--photo) 100%);
  display:grid; place-items:center;
}
.radar__grid, .radar__grid::before, .radar__grid::after{
  position:absolute; border:1px solid var(--line); border-radius:50%;
}
.radar__grid{ width:186px; height:186px; }
.radar__grid::before{ content:''; inset:31px; }
.radar__grid::after{ content:''; inset:62px; }

.radar__sweep{
  position:absolute; width:186px; height:186px; border-radius:50%;
  background:conic-gradient(
    color-mix(in srgb, var(--ink) 16%, transparent) 0deg,
    color-mix(in srgb, var(--ink) 4%, transparent) 42deg,
    transparent 78deg, transparent 360deg);
  animation:sweep 3.4s linear infinite;
}
@keyframes sweep{ to{ transform:rotate(1turn); } }

/* Отметки загораются вразнобой — след луча, а не гирлянда */
.radar__blip{
  position:absolute; left:var(--x); top:var(--y);
  width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  border-radius:50%; background:var(--invert); opacity:0;
  animation:blip 3.4s linear infinite var(--d);
}
@keyframes blip{
  0%{ opacity:0; transform:scale(.3); }
  7%{ opacity:1; transform:scale(1); }
  55%{ opacity:.3; transform:scale(1); }
  100%{ opacity:0; transform:scale(1); }
}

.radar__me{
  position:relative; z-index:1;
  width:48px; height:48px; border-radius:var(--r-pill);
  background:var(--surface); color:var(--ink);
  display:grid; place-items:center;
  box-shadow:var(--shadow-card);
}
.radar__tag{
  position:absolute; left:12px; bottom:12px;
  padding:6px 11px; border-radius:var(--r-pill);
  background:var(--invert); color:var(--invert-ink);
  font-size:12px; font-weight:600;
}
.radar__txt{ text-align:center; padding:14px 6px 2px; }
.radar__txt b{ display:block; font-size:16.5px; font-weight:700; letter-spacing:-.02em; }
.radar__txt span{ display:block; font-size:13px; color:var(--ink-2); margin-top:3px; }

/* --- поиск носильщика: маячок платформы --- */
.beacon{ display:flex; align-items:center; gap:14px; }
.beacon__ring{
  position:relative; width:52px; height:52px; flex:none;
  border-radius:var(--r-pill);
  background:var(--surface-2); color:var(--ink);
  display:grid; place-items:center;
}
.beacon__ring::before, .beacon__ring::after{
  content:''; position:absolute; inset:0;
  border-radius:var(--r-pill);
  border:1.5px solid var(--ink);
  animation:ping 2s var(--ease) infinite;
}
.beacon__ring::after{ animation-delay:1s; }
@keyframes ping{
  0%{ opacity:.45; transform:scale(1); }
  100%{ opacity:0; transform:scale(1.6); }
}
.beacon__txt b{ display:block; font-size:16px; font-weight:700; letter-spacing:-.02em; }
.beacon__txt span{ display:block; font-size:13px; color:var(--ink-2); margin-top:2px; }

/* Строка встречи: единственное, что пассажиру нужно знать до заказа —
   что носильщик придёт к нему сам, а не наоборот */
.meet{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--surface); border-radius:var(--r-card);
  padding:14px 16px; box-shadow:var(--shadow-card);
}
.meet:active{ transform:scale(.99); }
.meet__chev{ margin-left:auto; color:var(--ink-2); display:grid; place-items:center; }
.meet__ic{
  width:40px; height:40px; flex:none; border-radius:12px;
  background:var(--surface-2); color:var(--ink);
  display:grid; place-items:center;
}
/* Место встречи — первое, что человек ищет глазами на форме заказа. Белая
   карточка на почти белом фоне для этого слишком тихая, поэтому здесь
   настоящая картинка вместо серого значка и заголовок на ступень крупнее. */
.meet__shot{
  width:60px; height:46px; flex:none;
  border-radius:12px; overflow:hidden;
  background:var(--photo); color:var(--ink);
  display:grid; place-items:center;
}
.meet__img{ width:100%; height:100%; object-fit:cover; object-position:22% 55%; display:block; }
.meet--key{ box-shadow:var(--shadow-hero); padding:12px 14px; }
.meet--key .meet__txt b{ font-size:16.5px; }

/* Картинка выхода с платформы — единственная широкая в шите, поэтому
   подпись кладём на неё, а не под ней. */
.meetshot{ position:relative; border-radius:var(--r-card); overflow:hidden; background:var(--photo); }
.meetshot__img{ width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
.meetshot__tag{
  position:absolute; left:66%; bottom:12px; transform:translateX(-50%);
  padding:6px 11px; border-radius:var(--r-pill);
  background:var(--invert); color:var(--invert-ink);
  font-size:12.5px; font-weight:600;
}

.meet__txt{ flex:1; min-width:0; }
.meet__txt b{ display:block; font-size:15px; font-weight:700; letter-spacing:-.02em; }
.meet__txt span{
  display:block; font-size:13px; color:var(--ink-2); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* --- маршрут: точка А и точка Б в одной карточке ---------------------------
   Раньше место встречи было карточкой с шевроном, а место передачи — списком
   с галочками, и связь между ними приходилось додумывать. Это два конца
   одного пути, поэтому они лежат в одной карточке и выглядят одинаково. */
.row__ic--shot{ overflow:hidden; background:var(--photo); }
.row__ic--shot .ic3d{ object-fit:cover; object-position:61% 44%; }
.row--from{ padding-top:12px; padding-bottom:12px; }
.row--from .row__value{ font-size:16px; font-weight:700; letter-spacing:-.02em; }

/* Подзаголовок внутри карточки: выше — факт, ниже — выбор */
.rows__sep{
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  padding:10px 14px 4px;
}

/* --- когда встретить -------------------------------------------------------
   Самое дорогое в услуге — время, а на форме его не было вовсе: «подача от
   10 мин» осталась на главной и до экрана заказа не доехала. Вариантов два,
   и оба отвечают минутой, а не обещанием. */
.when{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.whenb{
  display:flex; flex-direction:column; gap:2px;
  text-align:left; padding:11px 13px;
  background:var(--surface); border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.whenb b{ font-size:14.5px; font-weight:700; letter-spacing:-.02em; }
.whenb span{ font-size:12.5px; color:var(--ink-2); }
.whenb:active{ transform:scale(.97); }
.whenb[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--invert), var(--shadow-card); }

/* --- сколько мест ----------------------------------------------------------
   Счётчик мест правит цену сильнее плиток размера, поэтому и весит столько же:
   отдельная карточка, крупная цифра со словом и строка о том, что случится
   с ценой на следующем нажатии. */
.bagsn{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border-radius:var(--r-card);
  padding:12px 12px 12px 16px; box-shadow:var(--shadow-card);
}
.bagsn__txt{ flex:1; min-width:0; }
.bagsn__n{ display:block; font-size:16px; font-weight:700; letter-spacing:-.02em; }
.bagsn__hint{ display:block; font-size:12.5px; color:var(--ink-2); margin-top:1px; }
/* Жёлтый занят действием, поэтому предупреждение усиливается не цветом,
   а полной насыщенностью текста. */
.bagsn__hint.warn{ color:var(--ink); font-weight:600; }
.bagsn .stepper__ctl{ gap:6px; }

/* --- расчёт ----------------------------------------------------------------
   Была серая строчка-сноска под формой, и скачок цены на четвёртом месте
   выглядел сбоем. Стал столбик слагаемых с итогом. */
.bill{
  display:flex; flex-direction:column; gap:7px;
  background:var(--surface); border-radius:var(--r-card);
  padding:13px 16px; box-shadow:var(--shadow-card);
}
.bill__r{ display:flex; align-items:baseline; gap:12px; font-size:13.5px; }
.bill__r span{ flex:1; min-width:0; color:var(--ink-2); }
.bill__r b{ flex:none; font-weight:600; }
.bill__r--sum{ font-size:15.5px; padding-top:9px; border-top:1px solid var(--line); }
.bill__r--sum span{ color:var(--ink); font-weight:700; letter-spacing:-.02em; }
.bill__r--sum b{ font-weight:800; letter-spacing:-.02em; }

/* --- маршрутная лента (вместо карты вокзала) --- */
.route{ display:flex; gap:0; }
.route__pt{ flex:1; min-width:0; position:relative; text-align:center; }
.route__pt::before{
  content:''; position:absolute; top:8px; left:-50%; right:50%;
  height:2px; background:var(--line);
}
.route__pt:first-child::before{ display:none; }
.route__pt[data-done="true"]::before{ background:var(--invert); }
.route__dot{
  position:relative; z-index:1;
  width:18px; height:18px; margin:0 auto;
  border-radius:var(--r-pill);
  background:var(--line);
  display:grid; place-items:center;
}
.route__pt[data-done="true"] .route__dot{ background:var(--invert); }
.route__pt[data-cur="true"] .route__dot{
  background:var(--invert);
  box-shadow:0 0 0 4px var(--yellow);
}
.route__nm{
  display:block; margin-top:9px;
  font-size:12px; line-height:1.3; color:var(--ink-2);
  padding:0 3px;
}
.route__pt[data-cur="true"] .route__nm{ color:var(--ink); font-weight:700; }

/* ----------------------------------------------------------------------------
   КАРТА ЗОН. Не план вокзала, а дерево именованных точек: ствол — общий путь
   от вагона до зала прибытия, ветки — куда багаж можно донести дальше.
   Геометрию здания рисовать нельзя, последовательность точек — можно.
   ------------------------------------------------------------------------- */
.zmap{ display:flex; flex-direction:column; gap:0; }

.zmap__trunk{ display:flex; flex-direction:column; gap:0; padding-left:8px; }
.zmap__node{
  position:relative; padding:0 0 18px 26px;
}
/* вертикальная нить ствола */
.zmap__node::before{
  content:''; position:absolute; left:5px; top:6px; bottom:-2px;
  width:2px; background:var(--invert);
}
.zmap__node::after{
  content:''; position:absolute; left:0; top:4px;
  width:12px; height:12px; border-radius:var(--r-pill);
  background:var(--invert);
}
.zmap__node b{ display:block; font-size:15px; font-weight:700; letter-spacing:-.02em; }
.zmap__node small{ display:block; font-size:12.5px; color:var(--ink-2); margin-top:1px; }

.zmap__leaves{
  display:flex; flex-direction:column; gap:8px;
  padding-left:22px; position:relative;
}
/* нить ствола продолжается вдоль веток и обрывается на последней */
.zmap__leaves::before{
  content:''; position:absolute; left:13px; top:0; bottom:26px;
  width:2px; background:var(--line);
}

.zmap__leaf{
  position:relative; margin-left:20px;
  display:flex; align-items:center; gap:12px; text-align:left;
  background:var(--surface); border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  padding:12px 14px;
}
/* горизонтальный отвод от ствола к карточке */
.zmap__leaf::before{
  content:''; position:absolute; left:-21px; top:50%;
  width:21px; height:2px; background:var(--line);
}
.zmap__leaf:active{ transform:scale(.99); }
.zmap__leaf[aria-pressed="true"]{
  background:var(--invert); color:var(--invert-ink); box-shadow:none;
}

.zmap__ic{
  flex:none;
  width:34px; height:34px; border-radius:11px;
  background:var(--surface-2); color:var(--ink);
  display:grid; place-items:center;
}
.zmap__leaf[aria-pressed="true"] .zmap__ic{ background:color-mix(in srgb, var(--invert-ink) 13%, transparent); color:var(--invert-ink); }
.zmap__leaf[aria-pressed="true"] .zmap__ic.is-art{ background:none; }

.zmap__body{ flex:1; min-width:0; }
.zmap__nm{ display:block; font-size:15px; font-weight:600; letter-spacing:-.02em; }
.zmap__path{
  display:block; font-size:11.5px; color:var(--ink-2);
  margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.zmap__path:empty{ display:none; }
.zmap__leaf[aria-pressed="true"] .zmap__path{ color:color-mix(in srgb, var(--invert-ink) 60%, transparent); }

/* --- код и круглые действия --- */
.foot{ display:flex; align-items:center; gap:8px; }
.code{ flex:1; font-size:13px; color:var(--ink-2); }
.code b{
  display:block; font-size:17px; font-weight:800; color:var(--ink);
  letter-spacing:.06em; font-variant-numeric:tabular-nums;
}
.code--fact b{ letter-spacing:-.02em; }
/* Код встречи — самое важное на экране: без него багаж не передать.
   Тёмная карточка, как плашка билета, и цифры в две трети ширины. */
.codecard{
  background:var(--invert); color:var(--invert-ink);
  border-radius:var(--r-card); padding:18px 16px 16px; text-align:center;
}
.codecard__lab{ display:block; font-size:12.5px; opacity:.6; }
.codecard__n{
  display:block; margin:5px 0 9px;
  font-size:34px; font-weight:800; letter-spacing:.09em;
  font-variant-numeric:tabular-nums;
}
.codecard__hint{ display:block; font-size:12.5px; line-height:1.4; opacity:.62; }

/* Действия носильщику. Круглая кнопка со значком 19 px читалась пятном —
   подпись под значком снимает вопрос, что это. */
.acts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.acts button{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:13px 4px 11px;
  background:var(--surface); border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  font-size:12.5px; font-weight:600; color:var(--ink);
  transition:transform .16s var(--ease);
}
.acts button i{
  display:grid; place-items:center; width:38px; height:38px;
  border-radius:var(--r-pill); background:var(--surface-2);
}
.acts button:active{ transform:scale(.95); }

/* Зона доставки крупно: на экране заказа это единственная картинка,
   и она отвечает на вопрос «куда именно понесли мой чемодан». */
.zshot{
  display:flex; align-items:center; gap:14px; padding:12px;
  background:var(--surface); border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.zshot__art{
  width:88px; height:88px; flex:none;
  border-radius:18px; background:var(--photo); color:var(--ink);
  display:grid; place-items:center; overflow:hidden;
}
.zshot__art img{ width:100%; height:100%; object-fit:contain; display:block; }
.zshot__txt{ min-width:0; }
.zshot__txt b{ display:block; font-size:16.5px; font-weight:700; letter-spacing:-.02em; }
.zshot__txt span{ display:block; font-size:13px; color:var(--ink-2); margin-top:3px; line-height:1.35; }

/* Приписка внутри карточки: не заголовок и не строка списка, а сноска. */
.fine{
  margin:12px 0 0; padding-top:11px;
  border-top:1px solid var(--line);
  font-size:12.5px; line-height:1.42; color:var(--ink-2);
}

/* --- звёзды --- */
.stars{ display:flex; justify-content:center; gap:8px; padding:4px 0 2px; }
/* Единственное место, где жёлтый не кнопка: оценка жёлтая везде, где её
   вообще ставят, а тёмная звезда читается как метка, а не как балл. */
.stars button{ color:var(--line); padding:2px; line-height:0; }
.stars button.on{ color:var(--yellow); }

/* Уже поставленная оценка — не кнопки, а результат. */
.starrow{ display:flex; gap:2px; color:var(--line); flex:none; }
.starrow i{ display:block; line-height:0; }
.starrow i.on{ color:var(--yellow); }
.stars button.pop{ animation:pop .32s var(--ease); }
@keyframes pop{
  0%{ transform:scale(1); }
  45%{ transform:scale(1.28); }
  100%{ transform:scale(1); }
}

/* --- теги и чаевые --- */
.tags{ display:flex; flex-wrap:wrap; gap:7px; }
.tag{
  padding:9px 13px; border-radius:var(--r-pill);
  background:var(--surface); font-size:13.5px; font-weight:500;
  box-shadow:var(--shadow-card);
  transition:background .16s var(--ease), color .16s var(--ease);
}
.tag[aria-pressed="true"]{ background:var(--invert); color:var(--invert-ink); box-shadow:none; }
.tag.pop{ animation:pop .28s var(--ease); }

.tips{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.tips button{
  padding:12px 4px; border-radius:var(--r-inner);
  background:var(--surface); text-align:center;
  font-size:14px; font-weight:600;
  box-shadow:var(--shadow-card);
  transition:background .16s var(--ease), color .16s var(--ease);
}
.tips button[aria-pressed="true"]{ background:var(--invert); color:var(--invert-ink); box-shadow:none; }

/* --- кнопки --- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; height:56px;
  border-radius:var(--r-btn);
  font-size:16px; font-weight:700; letter-spacing:-.02em;
  transition:transform .16s var(--ease), opacity .16s var(--ease);
}
.btn:active:not(:disabled){ transform:scale(.98); }
.btn:disabled{ opacity:.45; }

/* Жёлтый — фирменный, а не «светлый»: текст на нём тёмный в обеих темах */
.btn--main{
  background:var(--yellow-lit); color:var(--yellow-ink);
  box-shadow:0 2px 6px -2px var(--yellow-cast), 0 14px 26px -14px var(--yellow-cast);
}
.btn--ghost{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card); }

/* Демо-кнопка «пропустить ожидание»: намеренно тихая, не жёлтая */
.btn--skip{
  height:auto; padding:6px 0;
  font-size:13.5px; font-weight:600; color:var(--ink-2);
  text-decoration:underline; text-underline-offset:3px;
}
.btn--skip:active{ color:var(--ink); }

/* Перекат цены в кнопке */
.roll{ position:relative; display:inline-block; height:20px; overflow:hidden; min-width:1px; }
.roll:empty{ display:none; }   /* пустой перекат не должен раздвигать кнопку */
.roll span{
  display:block; white-space:nowrap;
  animation:roll-in .22s var(--ease) both;
}
.roll span.out{ position:absolute; top:0; left:0; animation:roll-out .18s var(--ease) both; }
@keyframes roll-in{ from{ transform:translateY(105%); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes roll-out{ from{ transform:none; opacity:1; } to{ transform:translateY(-105%); opacity:0; } }

/* --- чек прошлого заказа ---------------------------------------------------

   В историю заходят за одним: сколько это стоило. Сумма и есть заголовок
   экрана, всё остальное — объяснение, из чего она сложилась. */
.rcpt{
  background:linear-gradient(158deg,
    color-mix(in srgb, var(--invert) 86%, var(--invert-ink)) 0%, var(--invert) 56%);
  color:var(--invert-ink);
  border-radius:var(--r-hero); padding:20px;
  box-shadow:var(--shadow-hero);
}
.rcpt__when{ display:block; font-size:13px; opacity:.58; }
.rcpt__sum{
  display:block; margin:3px 0 12px;
  font-size:38px; font-weight:800; letter-spacing:-.04em;
}
.rcpt__pay{ display:flex; align-items:center; gap:8px; font-size:13.5px; opacity:.7; }

/* Кто нёс. Лицо здесь не украшение: через месяц человек помнит его,
   а номер жилета — нет. */
.whom{ display:flex; align-items:center; gap:12px; }
.whom__txt{ flex:1; min-width:0; }
.whom__txt b{ display:block; font-size:16.5px; font-weight:700; letter-spacing:-.02em; }
.whom__txt span{ display:block; font-size:13px; color:var(--ink-2); margin-top:2px; }

/* --- кабинет --- */
.me{
  background:linear-gradient(158deg,
    color-mix(in srgb, var(--invert) 86%, var(--invert-ink)) 0%, var(--invert) 56%);
  color:var(--invert-ink);
  border-radius:var(--r-hero); padding:22px 20px;
  box-shadow:var(--shadow-hero);
}
.me__top{ display:flex; align-items:center; gap:14px; }

/* Три цифры, которых человек про себя больше нигде не узнает. Без них
   кабинет — список настроек, куда незачем заходить. */
.me__stats{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  margin-top:19px; padding-top:16px;
  border-top:1px solid color-mix(in srgb, var(--invert-ink) 15%, transparent);
}
.me__stat b{ display:block; font-size:19px; font-weight:800; letter-spacing:-.03em; }
.me__stat span{ display:block; font-size:12px; opacity:.55; margin-top:3px; line-height:1.25; }
.me__ava{
  width:64px; height:64px; flex:none; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--invert-ink) 15%, transparent);
  color:var(--invert-ink); display:grid; place-items:center;
  font-size:20px; font-weight:700;
}
.me__name{ display:block; font-size:25px; font-weight:800; letter-spacing:-.035em; }
.me__phone{ display:block; font-size:14.5px; opacity:.6; margin-top:3px; }

@media (prefers-reduced-motion:reduce){
  .scan__line{ animation:none; top:50%; }
  .beacon__ring::before, .beacon__ring::after{ animation:none; opacity:0; }
  .radar__sweep{ animation:none; }
  .radar__blip{ animation:none; opacity:.5; }
  .roll span{ animation:none; }
  .stars button.pop, .tag.pop{ animation:none; }
}
</style>

<body>

<!-- ============================================================================
     ЭКРАН 1 — ГЛАВНАЯ. Здесь только то, ради чего приложение открывают:
     где мы работаем, что было раньше и кнопка вызова. Сам заказ живёт
     на отдельном экране, чтобы главная не превращалась в анкету.
     ========================================================================= -->
<div class="app" id="scr-home">

  <header class="head">
    <div class="head__hi" id="greeting">Добрый день</div>
    <button class="ava" id="ava-btn" type="button" aria-label="Кабинет">ДА</button>
  </header>

  <main class="feed">

    <!-- Заказ, который идёт прямо сейчас. Видна только пока он идёт. -->
    <button class="active" id="active" type="button" hidden>
      <span class="active__face" id="active-face"></span>
      <span class="active__body">
        <span class="active__name" id="active-name"></span>
        <span class="active__sub" id="active-sub"></span>
      </span>
      <span class="active__eta nums" id="active-eta"></span>
    </button>

    <!-- Плитки: одно действие и два раздела -->
    <div class="tiles3">
      <button class="tile tile--go" id="call-btn" type="button">
        <span class="tile__txt">
          <span class="tile__nm" id="call-label">Вызвать носильщика</span>
          <span class="tile__sub" id="call-sub"></span>
        </span>
        <!-- Тележка носильщика: рисунок объясняет плитку быстрее подписи -->
        <span class="tile__art" id="call-art"></span>
      </button>

      <!-- Карточка из макета целиком: заголовок и рисунок в ней уже есть,
           своих подписей поверх не ставим. -->
      <button class="tile tile--hist" id="go-history" type="button" aria-label="История заказов">
        <span id="hist-art"></span>
      </button>

      <button class="tile tile--card" id="go-me" type="button" aria-label="Кабинет">
        <span id="me-art"></span>
      </button>
    </div>

    <div class="group" id="last-title" hidden>Последний заказ</div>
    <div class="rows" id="last" hidden></div>

    <h2 class="h2">Где работаем</h2>
    <p class="note">Три вокзала Москвы. Нажмите на вокзал — покажем зоны передачи и цены.</p>

    <div class="stations" id="st-cards"></div>

  </main>
</div>

<!-- ============================================================================
     ЭКРАН 2 — всё остальное. Заказ, кабинет и история открываются
     полноценными экранами со своей шапкой и стрелкой назад, а не шторками:
     шторка уместна для короткого пояснения, а не для длинного шага.
     ========================================================================= -->
<div class="app page" id="page" hidden>
  <header class="phead">
    <button class="phead__nav" id="page-back" type="button" aria-label="Назад">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <h1 class="phead__t" id="page-title"></h1>
  </header>
  <main class="feed" id="page-body"></main>
  <div class="dock" id="page-foot" hidden></div>
</div>

<!-- ============================================================================
     БОТТОМ-ШИТ. Только для коротких пояснений поверх экрана: выбор вокзала,
     карта зон, справка об оплате. Шагов заказа здесь нет.
     ========================================================================= -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close="1"></div>
  <div class="sheet__win" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet__head">
      <button class="sheet__nav off" id="sheet-back" type="button" aria-label="Назад">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <h3 id="sheet-title"></h3>
      <button class="sheet__nav" id="sheet-close" type="button" aria-label="Закрыть">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="sheet__body" id="sheet-body"></div>
    <div class="sheet__foot" id="sheet-foot" hidden></div>
  </div>
</div>

<p class="sr-only" id="live-msg" aria-live="polite"></p>

/* ============================================================================
   РАСЧЁТ И ФОРМАТ
   ========================================================================= */

function stById(id){
  return STATIONS.find(s => s.id === id) || STATIONS[0];
}

function stationOf(){
  const id = state.trip ? state.trip.station : state.station;
  return STATIONS.find(s => s.id === id) || STATIONS[0];
}

function zoneOf(){ return ZONES.find(z => z.id === state.zone); }
function sizeOf(){ return SIZES.find(s => s.id === state.size); }

/* 350 ₽ за первое место и 100 ₽ за каждое следующее. Второй носильщик —
   ещё 350 ₽: это вторая пара рук, а не наценка. От зоны цена не зависит:
   все точки внутри вокзала, и разница в паре сотен шагов. */
function calc(){
  const st = stationOf(), zn = zoneOf(), sz = sizeOf();
  const two = state.size === 'big' || state.bags > 3;
  const sum = sz.base + 100 * (state.bags - 1) + (two ? 350 : 0);
  return { sum:sum, people: two ? 2 : 1, st:st, zn:zn };
}

/* В комментарий пишет человек, а вставляем мы его в строку разметки */
const esc = (s) => s.replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);

const money = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if(a === 1 && b !== 11) return one;
  if(a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}

function places(){ return state.bags + ' ' + plural(state.bags, 'место', 'места', 'мест'); }

/* Когда встретят. Точка отсчёта у пассажира одна — время прибытия из билета:
   либо он уже на перроне и носильщик идёт сейчас, либо поезд ещё в пути
   и встреча назначена на минуту прибытия. */
function whenText(){
  return state.when === 'now'
    ? 'через ' + stationOf().wait + ' мин'
    : state.trip ? 'в ' + state.trip.arrive : 'к прибытию поезда';
}

/* Цена слушается количества мест сильнее, чем размера: каждое следующее место
   стоит 100 ₽, а четвёртое зовёт вторую пару рук и добавляет сразу 350 ₽.
   Сказать об этом надо до нажатия плюса — после это уже не предупреждение,
   а объяснение скачка. */
function bagsHint(){
  if(state.size === 'big')
    return { txt:'Крупное несут двое: +350 ₽', warn:false };
  if(state.bags >= 4)
    return { txt:'Работают двое: +350 ₽ в сумме', warn:true };
  if(state.bags === 3)
    return { txt:'С четвёртого места работают двое: +350 ₽', warn:true };
  return { txt:'Каждое следующее место — 100 ₽', warn:false };
}

/* Носильщик ждёт не у двери вагона. Из состава разом выходит несколько сот
   человек, и поиск друг друга в этой толпе — худшая часть услуги. Встреча
   всегда в одной размеченной точке у выхода с платформы: её видно издалека
   и её можно показать на схеме. */
function meetPlace(){
  return state.trip
    ? 'Платформа ' + state.trip.platform + ', у выхода с перрона'
    : 'У выхода с платформ';
}

function mmss(sec){
  if(sec < 0) sec = 0;
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

/* Маршрутная лента: старт → промежуточные точки → зона передачи */
function routePoints(){
  const zn = zoneOf();
  const start = state.trip
    ? { nm:'Платформа ' + state.trip.platform, ph:'зона встречи' }
    : { nm:'Зона встречи', ph:'зона встречи' };

  const mid = (ZONE_ROUTE[zn.id] || []).map(nm => ({ nm:nm, ph:nm.toLowerCase() }));
  const pts = [start].concat(mid, [{ nm:zn.name, ph:zn.ph }]);

  /* две одинаковые точки подряд смысла не несут */
  return pts.filter((p, i) => i === 0 || p.nm !== pts[i - 1].nm);
}

/* На какой точке маршрута мы сейчас */
function routeIndex(){
  const last = routePoints().length - 1;
  if(state.stage === 'picked') return Math.min(1, last);
  if(state.stage === 'delivered' || state.stage === 'rating') return last;
  return 0;
}

/* Старое значение уезжает вверх, новое приезжает снизу.
   Текущий элемент ищем среди не уезжающих — иначе за время анимации
   в контейнере накапливаются лишние span. */
function rollTo(host, text){
  if(!host) return;
  const cur = host.querySelector('span:not(.out)');
  if(cur && cur.textContent === text) return;
  if(!cur){ host.innerHTML = '<span>' + text + '</span>'; return; }
  cur.classList.add('out');
  setTimeout(() => cur.remove(), 200);
  const next = document.createElement('span');
  next.textContent = text;
  host.appendChild(next);
}

function say(msg){ $('live-msg').textContent = msg; }

/* ============================================================================
   ГЛАВНАЯ
   ========================================================================= */

function phBlock(cls, label){
  return '<span class="' + cls + ' ph">' + label + '</span>';
}

/* Слот под снимок: есть файл — показываем его, нет — запасной вариант.
   Так пустой слот не выглядит поломкой, а фото подставляется одной строкой. */
function photo(src, alt, cls, fallback){
  return src
    ? '<img class="' + cls + '" src="' + src + '" alt="' + alt + '" loading="lazy">'
    : (fallback || phBlock(cls, alt));
}

function renderStationCards(){
  /* Пока билет не отсканирован, вокзал в state — просто значение по умолчанию.
     Подписывать им чужую карточку «Ваш вокзал» нельзя: пассажир поверит. */
  const here = state.trip ? state.trip.station : null;

  $('st-cards').innerHTML = STATIONS.map(s =>
    '<button class="stile" type="button" data-st="' + s.id + '">' +
      photo(PHOTOS.station[s.id], s.name, 'stile__art') +
      '<span class="stile__txt">' +
        '<span class="stile__nm">' + s.short + '</span>' +
        '<span class="stile__sub">' + s.dir + '</span>' +
        (s.id === here
          ? '<span class="stile__here">Ваш вокзал</span>'
          : '<span class="stile__sub">Подача от ' + s.wait + ' мин</span>') +
      '</span>' +
    '</button>').join('');
}

/* Приветствие вместо названия приложения: пассажир и так знает,
   что он открыл, — ему полезнее время суток и его собственный рейс. */
function greeting(){
  const h = new Date().getHours();
  if(h < 5)  return 'Доброй ночи';
  if(h < 12) return 'Доброе утро';
  if(h < 18) return 'Добрый день';
  return 'Добрый вечер';
}

function renderTopbar(){
  $('greeting').textContent = greeting();
}

function histRow(h, i){
  return '<button class="row" type="button" data-act="past" data-i="' + i + '">' +
    zoneIc(zoneByName(h.zone)) +
    '<span class="row__body">' +
      '<span class="row__label">' + h.date + ' · ' + h.zone.toLowerCase() + '</span>' +
      '<span class="row__value">' + stById(h.st).name + '</span>' +

    '<span class="row__extra nums">' + money(h.sum) + '</span>' +

}

/* Последний заказ — самый частый сценарий: тот же вокзал, та же зона */
function renderLast(){

/* Плашка активного заказа — аналог плашки активной поездки */
function renderActive(){

  };

  $('active-sub').textContent = subs[state.stage] || '';

/* Плитка действия. Пока заказ идёт — она ведёт в заказ, а не начинает второй. */

/* ============================================================================
   НАВИГАЦИЯ. Два контейнера с одинаковым устройством: экран и шит.

   Экран — для всего, что требует внимания и занимает время: билет, заказ,
   кабинет, история. У экрана своя шапка и стрелка назад.
   Шит — только для короткого пояснения поверх экрана: выбрать вокзал,
   посмотреть карту зон, прочитать про оплату.

   Рендеры у них общие, поэтому body() и foot() пишут в тот контейнер,
   который сейчас рисуется.
   ========================================================================= */

let host = 'page';          /* 'page' | 'sheet' — куда сейчас пишут body/foot */

const PAGES = {
  ticket:  { title:'Билет',             render:sheetTicket },
  manual:  { title:'Номер билета',      render:sheetManual },
  form:    { title:'Заказ',             render:sheetOrderForm },
  search:  { title:'Ищем носильщика',   render:sheetSearch },
  order:   { title:'Ваш заказ',         render:sheetOrder },
  history: { title:'История заказов',   render:sheetHistory },
  past:    { title:'Заказ',             render:sheetPastOrder },
  me:      { title:'Кабинет',           render:sheetMe }
};

const SHEETS = {
  stinfo:  { title:'Вокзал',            render:sheetStationInfo },
  cmnt:    { title:'Комментарий',       render:sheetComment },
  zmap:    { title:'Место встречи',     render:sheetZoneMap },
  note:    { title:'Носильщик',         render:sheetNote }
};

/* --- экраны --- */

let pages = [];

function openPage(name, arg){ pages = [{ name:name, arg:arg }]; paintPage(); }
function pushPage(name, arg){ pages.push({ name:name, arg:arg }); paintPage(); }

/* Замена текущего шага без роста стека: назад с заказа ведёт на главную,
   а не обратно в сканер — билет уже распознан, пересканировать нечего */
function swapPage(name, arg){
  pages[pages.length - 1] = { name:name, arg:arg };
  paintPage();
}

function backPage(){
  if(pages.length <= 1) return goHome();
  pages.pop();
  paintPage();
}

function paintPage(){
  const cur = pages[pages.length - 1];
  const def = PAGES[cur.name];

  closeSheet();
  $('scr-home').hidden = true;
  $('page').hidden = false;
  $('page-title').textContent = def.title;
  $('page-foot').hidden = true;
  $('page-foot').innerHTML = '';
  $('page-body').innerHTML = '';

  host = 'page';
  def.render(cur.arg);
  window.scrollTo(0, 0);
}

function goHome(){
  pages = [];
  closeSheet();
  $('page').hidden = true;
  $('scr-home').hidden = false;
  clearTimeout(scanTimer);
  clearInterval(phraseTimer);
  renderHome();
  window.scrollTo(0, 0);
}

/* Открыт ли сейчас именно этот экран — таймеры не должны стрелять в пустоту */
function isOpen(name){
  return !$('page').hidden && pages.length && pages[pages.length - 1].name === name;
}

/* --- шиты --- */

let stack = [];

function openSheet(name, arg){
  stack = [{ name:name, arg:arg }];
  paintSheet();
}

function pushSheet(name, arg){
  stack.push({ name:name, arg:arg });
  paintSheet();
}

function backSheet(){
  if(stack.length <= 1) return closeSheet();
  stack.pop();
  paintSheet();
}

function paintSheet(){
  const cur = stack[stack.length - 1];
  const def = SHEETS[cur.name];

  $('sheet').hidden = false;
  $('sheet-title').textContent = def.title;
  $('sheet-back').classList.toggle('off', stack.length <= 1);
  $('sheet-foot').hidden = true;
  $('sheet-foot').innerHTML = '';
  $('sheet-body').innerHTML = '';
  $('sheet-body').scrollTop = 0;

  host = 'sheet';
  def.render(cur.arg);
  host = 'page';

  sheetEdge();
}

/* Долистали до конца — край перестаёт гаснуть */
function sheetEdge(){
  const b = $('sheet-body');
  b.classList.toggle('sheet__body--more',
    b.scrollHeight - b.clientHeight - b.scrollTop > 8);
}

function closeSheet(){
  $('sheet').hidden = true;
  stack = [];
}

function body(html){ $(host + '-body').innerHTML = html; }

function foot(html){
  $(host + '-foot').innerHTML = html;
  $(host + '-foot').hidden = !html;
}

function fact(label, value){
  return '<span class="code code--fact">' + label + '<b class="nums">' + value + '</b></span>';
}

function mainBtn(act, label, price, disabled){
  return '<button class="btn btn--main" type="button" data-act="' + act + '"' +
    (disabled ? ' disabled' : '') + '>' +
    '<span>' + label + '</span>' +
    '<span class="roll" data-roll="1">' + (price ? '<span>' + price + '</span>' : '') + '</span>' +
    '</button>';
}

  body(

    '<div class="field">' +
      '<input id="tk" type="text" inputmode="numeric" maxlength="17" ' +

/* Номер разбирается в один из известных рейсов — чтобы демо было устойчивым */
function readTicket(value){
  const digits = value.replace(/\D/g, '');
  if(digits.length < 14) return null;
  const sum = digits.split('').reduce((a, d) => a + (+d), 0);
  return TRIPS[sum % TRIPS.length];
}

function applyTicket(raw){
  const trip = readTicket(raw);
  if(!trip) return;
  clearTimeout(scanTimer);
  state.trip = trip;
  state.station = trip.station;
  renderTopbar();
  say('Билет распознан: ' + trip.train + ', вагон ' + trip.car);

  /* билет распознан — шаг сканера в стеке больше не нужен: «назад»
     с формы заказа должно вести на главную, а не обратно в сканер */
  swapPage('form');
}

/* ============================================================================
   ШАГ 2 — ЗАКАЗ. Зона и багаж на одном экране: пассажир держит чемоданы
   и не должен листать мастер из четырёх шагов. Цена пересчитывается на лету.
   ========================================================================= */

function passHTML(){
  const t = state.trip;
  if(!t) return '';
  const st = STATIONS.find(s => s.id === t.station);
  return '<div class="pass">' +
    '<div class="pass__top"><span class="pass__train">' + t.train + '</span></div>' +
    '<div class="pass__way">' + t.from + ' → ' + st.name + '</div>' +
    '<div class="pass__tear"></div>' +
    '<div class="pass__grid nums">' +
      '<span><b>' + t.arrive + '</b><span>прибытие</span></span>' +
      '<span><b>' + t.car + '</b><span>вагон</span></span>' +
      '<span><b>' + t.platform + '</b><span>платформа</span></span>' +
    '</div>' +
  '</div>';
}

/* Иконка зоны: пока картинки нет — линейный значок, чтобы список
   не разъезжался. */
/* Зона прошлого заказа хранится названием — по нему и находим значок. */
function zoneByName(name){
  return ZONES.find(z => z.name === name) || ZONES[0];
}

function zoneIc(z, wrap, size){
  const art = PHOTOS.zone[z.id];
  return '<span class="' + (wrap || 'row__ic') + (art ? ' is-art' : '') + '">' +
    photo(art, '', 'ic3d', icon(z.art, size || 21)) +
  '</span>';
}

/* Строки «куда донести» — без своей обёртки: они лежат в карточке маршрута
   сразу под точкой встречи, чтобы А и Б читались как одна пара. */
function zoneRows(){
  return ZONES.map(z =>
    '<button class="row" type="button" data-act="zone" data-id="' + z.id + '">' +
      zoneIc(z) +
      '<span class="row__body">' +
        '<span class="row__value">' + z.name + '</span>' +
        '<span class="row__label">' + z.sub + '</span>' +
      '</span>' +
      '<span class="check' + (z.id === state.zone ? ' on' : '') + '">' + icon('check', 13, 2.4) + '</span>' +
    '</button>').join('');
}

/* Форма заказа отвечает на три вопроса: откуда и куда несут багаж, когда
   встретят и что именно несём. Маршрут собран в одну карточку: место встречи

/* Дерево зон для справки о вокзале: от места встречи к каждой из точек.
   Здесь ничего не выбирают — это описание услуги, а не список. */
function zoneTree(){
  const branch = (z) => {
    /* в ветке — путь от места встречи до зоны, без описания здания;
       последняя точка совпадает с названием зоны и в подписи не нужна */
    const tail = (ZONE_ROUTE[z.id] || []).filter(nm => nm !== z.name).join(' → ');
    return '<span class="zmap__leaf">' +
      zoneIc(z, 'zmap__ic', 20) +
      '<span class="zmap__body">' +
        '<span class="zmap__nm">' + z.name + '</span>' +
        '<span class="zmap__path">' + (tail || z.sub) + '</span>' +
      '</span>' +
    '</span>';
  };

  return '<div class="zmap">' +
      '<div class="zmap__trunk">' +
        '<span class="zmap__node"><b>Зона встречи у выхода с платформ</b>' +
          '<small>здесь вас встретят</small></span>' +
      '</div>' +
      '<div class="zmap__leaves">' + ZONES.map(branch).join('') + '</div>' +
    '</div>';
}

/* Место встречи. Карты вокзала здесь нет и не будет: подробный план объекта

function sheetZoneMap(){
  const t = state.trip;
  body(
    '<div class="meetshot">' +
      photo(PHOTOS.meet, 'Выход с платформы под жёлтым указателем', 'meetshot__img') +
      '<span class="meetshot__tag">Указатель «Н»</span>' +

    '<p class="lead">Носильщик ждёт ' +
