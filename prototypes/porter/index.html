    '<div class="group">Куда поедет багаж</div>' +
    routeHTML()
  );
  foot(mainBtn('zone-done', 'Понятно'));
}

/* Два варианта времени, а не один: пассажир либо уже стоит с чемоданами
   на перроне, либо ещё едет — и в обоих случаях ему нужна не «подача от
   10 мин» вообще, а конкретная минута. */
function whenHTML(){
  const st = stationOf(), t = state.trip;
  const opt = (id, nm, sub) =>
    '<button class="whenb" type="button" data-act="when" data-id="' + id + '" ' +
      'aria-pressed="' + (state.when === id) + '">' +
      '<b>' + nm + '</b><span class="nums">' + sub + '</span>' +
    '</button>';

  return opt('now', 'Сейчас', 'через ' + st.wait + ' мин') +
    opt('arrive', 'К прибытию',
        t ? t.arrive + ' · платформа ' + t.platform : 'когда придёт поезд');
}

/* Расчёт столбиком, а не строчкой-сноской: когда слагаемые видно по одному,
   появление второго носильщика перестаёт выглядеть ошибкой калькулятора. */
function billHTML(){
  const r = calc(), sz = sizeOf();
  const rows = [['Первое место, ' + sz.name.toLowerCase(), sz.base]];

  if(state.bags > 1)
    rows.push(['Ещё ' + (state.bags - 1) + ' ' +
      plural(state.bags - 1, 'место', 'места', 'мест'), 100 * (state.bags - 1)]);

  if(r.people === 2)
    rows.push([state.size === 'big'
      ? 'Второй носильщик — крупный багаж'
      : 'Второй носильщик — от четырёх мест', 350]);

  return rows.map(row =>
      '<span class="bill__r"><span>' + row[0] + '</span>' +
        '<b class="nums">' + money(row[1]) + '</b></span>').join('') +
    '<span class="bill__r bill__r--sum"><span>Итого</span>' +
      '<b class="nums">' + money(r.sum) + '</b></span>';
}

/* Всё на форме зависит от одного состояния, поэтому и пересчитывается разом:
   плитки размера, счётчик мест, время встречи, расчёт и цена на кнопке. */
function renderBags(){
  const host = $('sizes');
  if(!host) return;

  host.innerHTML = SIZES.map(s =>
    '<button class="size" type="button" data-act="size" data-id="' + s.id + '" ' +
      'aria-pressed="' + (s.id === state.size) + '">' +
      '<span class="size__box">' +
        photo(PHOTOS.size[s.id], '', 'size__art') +
      '</span>' +
      '<span class="size__nm">' + s.name + '</span>' +
      '<span class="size__kg">' + s.hint + '</span>' +
    '</button>').join('');

  const r = calc();
  $('bags-n').textContent = places();

  const hint = bagsHint(), hn = $('bags-hint');
  if(hn){
    hn.textContent = hint.txt;
    hn.classList.toggle('warn', hint.warn);
  }

  const minus = document.querySelector('[data-act="bag-minus"]');
  const plus  = document.querySelector('[data-act="bag-plus"]');
  if(minus) minus.disabled = state.bags <= 1;
  if(plus)  plus.disabled  = state.bags >= 6;

  const when = $('when');
  if(when) when.innerHTML = whenHTML();

  const bill = $('bill');
  if(bill) bill.innerHTML = billHTML();

  rollTo(document.querySelector('[data-roll]'), money(r.sum));
}

function routeHTML(){
  const pts = routePoints();
  const idx = routeIndex();
  const live = state.stage !== 'idle';

  return '<div class="route">' + pts.map((p, i) =>
    '<span class="route__pt" data-done="' + (live && i <= idx) + '" data-cur="' + (live && i === idx) + '">' +
      '<span class="route__dot"></span>' +
      '<span class="route__nm">' + p.nm + '</span>' +
    '</span>').join('') + '</div>';
}

/* ============================================================================
   ШАГ 4 — ПОИСК
   ========================================================================= */

function sheetSearch(){
  const st = stationOf();

  /* Точки расставлены руками, а не случайно: случайные каждый раз собираются
     в кучу или в линию, и это видно. */
  const blips = [[30, 33], [72, 24], [23, 68], [78, 71], [56, 84]];

  body(
    '<div class="card">' +
      '<div class="radar">' +
        '<span class="radar__grid"></span>' +
        '<span class="radar__sweep"></span>' +
        blips.map((b, i) =>
          '<span class="radar__blip" style="--x:' + b[0] + '%;--y:' + b[1] + '%;' +
            '--d:' + (i * 0.55).toFixed(2) + 's"></span>').join('') +
        '<span class="radar__me">' + icon('plat', 21) + '</span>' +
        '<span class="radar__tag">' + st.name + '</span>' +
      '</div>' +
      '<div class="radar__txt">' +
        '<b>Обычно подходит за ' + st.wait + ' минут</b>' +
        '<span id="phrase">' + PHRASES[0] + '</span>' +
      '</div>' +
    '</div>' +

    '<div class="group">Куда несём багаж</div>' +
    '<div class="card">' + routeHTML() +
      '<p class="fine">' + oneStation() + '</p>' +
    '</div>'
  );
  foot('<button class="btn btn--ghost" type="button" data-act="cancel">Отменить поиск</button>');

  let i = 0;
  clearInterval(phraseTimer);
  phraseTimer = setInterval(() => {
    i = (i + 1) % PHRASES.length;
    const el = $('phrase');
    if(el) el.textContent = PHRASES[i];
  }, 900);
}


/* ============================================================================
   ШИТ ЗАКАЗА. Здесь живёт весь остаток жизненного цикла, включая оценку:
   отдельного экрана «оцените поездку» нет.
   ========================================================================= */

/* Плитка действия: значок и подпись под ним. */
function actBtn(act, ic, label){
  return '<button type="button" data-act="' + act + '">' +
    '<i>' + icon(ic, 21) + '</i>' + label +
  '</button>';
}

/* Уже поставленная оценка: пять звёзд, из них n жёлтых. Пустые не прячем —
   «4 из 5» видно только тогда, когда видно и пятую. */
function starRow(n, size){
  const s = size || 16;
  const star = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" ' +
    'fill="currentColor" aria-hidden="true">' +
    '<path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8L12 3.6Z"/></svg>';
  return '<span class="starrow" role="img" aria-label="Оценка ' + n + ' из 5">' +
    [1,2,3,4,5].map(i => '<i class="' + (i <= n ? 'on' : '') + '">' + star + '</i>').join('') +
  '</span>';
}

/* Куда несём багаж — картинкой, а не строкой списка. Без аргументов берёт
   текущий заказ, с аргументами — любой прошлый. */
function zoneShot(zn, st){
  zn = zn || zoneOf();
  st = st || stationOf();
  return '<div class="zshot">' +
    '<span class="zshot__art">' +
      photo(PHOTOS.zone[zn.id], '', '', icon(zn.art, 40)) +
    '</span>' +
    '<span class="zshot__txt">' +
      '<b>' + zn.name + '</b>' +
      '<span>' + st.short + ' · ' + zn.sub + '</span>' +
    '</span>' +
  '</div>';
}

/* Услуга целиком помещается в одно здание. Пассажиру это неочевидно:
   «доставка багажа» звучит так, будто чемодан уедет в другой город. */
function oneStation(){
  return 'Один вокзал от начала до конца: ' + stationOf().name +
    ' — где багаж приняли, там же и отдадут. Между вокзалами и городами ' +
    'носильщик багаж не возит.';
}

function porterCard(){
  const p = state.porter, r = calc();
  const showEta = state.stage === 'assigned' || state.stage === 'picked';

  return '<div class="card">' +
    '<div class="beacon">' +
      '<span class="active__face active__face--l">' + portrait(p) + '</span>' +
      '<span class="beacon__txt" style="flex:1">' +
        '<b>' + p.name + (r.people === 2 ? ' и напарник' : '') + '</b>' +
        '<span>★ ' + p.rating + ' · жилет №' + p.vest + ' · ' + p.years + ' года</span>' +
      '</span>' +
      (showEta
        ? '<span class="active__eta nums">' + mmss(state.left) +
          '<small>' + (state.stage === 'picked' ? 'до передачи' : 'до встречи') + '</small></span>'
        : '') +
    '</div></div>';
}

function stageLine(){
  const zn = zoneOf();
  if(state.stage === 'assigned')
    return { t:'Идёт к вам', s:'Встретит ' + whenText() + ' · ' + meetPlace() };
  if(state.stage === 'arrived')   return { t:'Ждёт на месте', s:'Назовите код — и передайте багаж' };
  if(state.stage === 'picked')    return { t:'Несёт багаж',   s:'Принял ' + places() + ' · до ' + zn.gen };
  if(state.stage === 'delivered') return { t:'Передал багаж', s:'Проверьте места: ' + places() };
  return { t:'Багаж доставлен', s:'Оцените работу' };
}

function sheetOrder(){
  if(!state.porter) return goHome();

  if(state.stage === 'rating') return renderRating();

  const p = state.porter, ln = stageLine();
  const code = (state.bags + 6) + 'К-' + (400 + p.vest * 3);
  const give = state.stage === 'picked' || state.stage === 'delivered';
  const codeLabel = give ? 'Код передачи' : 'Код встречи';
  const codeHint = give
    ? 'Тот же код нужен, чтобы забрать багаж обратно'
    : 'Назовите его носильщику — по коду видно, что багаж ваш';

  body(
    porterCard() +
    '<div class="card">' +
      '<div class="row" style="padding:0;border:0;pointer-events:none">' +
        '<span class="row__body">' +
          '<span class="row__value">' + ln.t + '</span>' +
          '<span class="row__label">' + ln.s + '</span>' +
        '</span>' +
      '</div>' +
    '</div>' +
    (state.note
      ? '<div class="card"><div class="row" style="padding:0;border:0;pointer-events:none">' +
          '<span class="row__ic">' + icon('chat', 20) + '</span>' +
          '<span class="row__body">' +
            '<span class="row__label">Ваш комментарий</span>' +
            '<span class="row__value">' + esc(state.note) + '</span>' +
          '</span>' +
        '</div></div>'
      : '') +
    '<div class="codecard">' +
      '<span class="codecard__lab">' + codeLabel + '</span>' +
      '<b class="codecard__n">' + code + '</b>' +
      '<span class="codecard__hint">' + codeHint + '</span>' +
    '</div>' +

    '<div class="acts">' +
      actBtn('phone', 'call',  'Позвонить') +
      actBtn('chat',  'chat',  'Написать') +
      actBtn('share', 'share', 'Поделиться') +
    '</div>' +

    '<div class="group">Куда несём багаж</div>' +
    zoneShot() +
    '<div class="card">' + routeHTML() +
      '<p class="fine">' + oneStation() + '</p>' +
    '</div>'
  );

  const cta =
    state.stage === 'assigned'  ? '<button class="btn btn--ghost" type="button" data-act="cancel">Отменить заказ</button>' :
    state.stage === 'arrived'   ? mainBtn('handover', 'Передать багаж по коду') :
    state.stage === 'picked'    ? '<button class="btn btn--ghost" type="button" disabled>Багаж несут · ' + places() + '</button>' :
    state.stage === 'delivered' ? mainBtn('finish', 'Получил багаж') : '';

  /* Демо: пропустить ожидание, чтобы показ не упирался в таймеры */
  const skip = (state.stage === 'assigned' || state.stage === 'picked')
    ? '<button class="btn btn--skip" type="button" data-act="skip">Пропустить ожидание</button>'
    : '';

  foot(cta + skip);
}

function renderRating(){
  const p = state.porter;

  body(
    '<div class="card">' +
      '<div class="beacon">' +
        '<span class="active__face active__face--l">' + portrait(p) + '</span>' +
        '<span class="beacon__txt"><b>Багаж доставлен</b>' +
          '<span>' + p.name + ', жилет №' + p.vest + '</span></span>' +
      '</div>' +
      '<div class="stars" id="stars"></div>' +
    '</div>' +
    '<div class="group">Что понравилось</div>' +
    '<div class="tags" id="tags"></div>' +
    '<div class="group">Чаевые</div>' +
    '<div class="tips" id="tips"></div>'
  );
  foot(mainBtn('send', 'Отправить', '', true));

  renderStars();
  renderMarks();
  renderTips();
  renderSendBtn();
}

function renderStars(){
  const star = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
    '<path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8L12 3.6Z"/></svg>';

  $('stars').innerHTML = [1,2,3,4,5].map(n =>
    '<button type="button" data-act="star" data-n="' + n + '" ' +
      'class="' + (n <= state.stars ? 'on' : '') + '" ' +
      'aria-label="Оценка ' + n + '">' + star + '</button>').join('');
}

function renderMarks(){
  $('tags').innerHTML = MARKS.map(m =>
    '<button class="tag" type="button" data-act="mark" data-name="' + m + '" ' +
      'aria-pressed="' + (state.marks.indexOf(m) > -1) + '">' + m + '</button>').join('');
}

function renderTips(){
  $('tips').innerHTML = TIPS.map(a =>
    '<button type="button" data-act="tip" data-t="' + a + '" aria-pressed="' + (state.tip === a) + '">' +
      (a === 0 ? 'Без' : '<span class="nums">+' + a + ' ₽</span>') +
    '</button>').join('');
}

function renderSendBtn(){
  const btn = document.querySelector('[data-act="send"]');
  if(!btn) return;
  btn.disabled = state.stars === 0;
  btn.querySelector('span').textContent = state.stars === 0 ? 'Поставьте оценку' : 'Отправить';

  const roll = btn.querySelector('[data-roll]');
  if(state.tip) rollTo(roll, '+ ' + money(state.tip));
  else roll.innerHTML = '';
}

/* ============================================================================
   ЖИЗНЕННЫЙ ЦИКЛ ЗАКАЗА
   ========================================================================= */

function startSearch(){
  state.stage = 'searching';
  renderActive();
  say('Ищем носильщика');

  swapPage('search');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(assign, DEMO.search);
}

function assign(){
  const idx = (state.bags + Math.max(0, TRIPS.indexOf(state.trip))) % PORTERS.length;
  state.porter = PORTERS[idx];
  state.stage = 'assigned';
  state.left = DEMO.meet;

  say('Носильщик ' + state.porter.name + ' назначен, жилет ' + state.porter.vest);
  renderActive();

  /* Заказ принят — шаги оформления в стеке больше не нужны: «назад»
     из активного заказа в выбор зоны привёл бы ко второму заказу. */
  if(isOpen('search')) openPage('order');
  startTick();
}

/* Один секундный таймер на обе стадии ожидания */
function startTick(){
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    state.left--;
    if(state.left > 0){
      renderActive();
      const eta = document.querySelector('#page .active__eta');
      if(eta) eta.innerHTML = mmss(state.left) +
        '<small>' + (state.stage === 'picked' ? 'до передачи' : 'до встречи') + '</small>';
      return;
    }
    clearInterval(tickTimer);
    if(state.stage === 'assigned') arrive();
    else if(state.stage === 'picked') deliver();
  }, 1000);
}

function arrive(){
  clearInterval(tickTimer);
  state.stage = 'arrived';
  state.left = 0;
  say('Носильщик на месте — передайте багаж по коду');
  renderActive();
  if(isOpen('order')) paintPage();
}

function handOver(){
  state.stage = 'picked';
  state.left = DEMO.carry;
  say('Багаж принят, носильщик несёт до ' + zoneOf().gen);
  renderActive();
  if(isOpen('order')) paintPage();
  startTick();
}

function deliver(){
  clearInterval(tickTimer);
  state.stage = 'delivered';
  state.left = 0;
  say('Багаж передан — проверьте фото и подтвердите');
  renderActive();
  if(isOpen('order')) paintPage();
}

function finishOrder(){
  state.stage = 'rating';
  renderActive();
  if(isOpen('order')) paintPage();
  else openPage('order');
}

function submitRating(){
  const r = calc();
  HISTORY.unshift({
    date:'сегодня',
    st:r.st.id,
    time:new Date().toTimeString().slice(0, 5),
    zone:r.zn.name,
    size:state.size,
    bags:state.bags,
    tip:state.tip,
    sum:r.sum + state.tip,
    stars:state.stars
  });
  say('Спасибо! Оценка отправлена');
  resetOrder();
  goHome();
}

function cancelOrder(){
  clearInterval(tickTimer);
  clearTimeout(searchTimer);
  say('Заказ отменён');
  resetOrder();
  goHome();
}

function resetOrder(){
  clearInterval(tickTimer);
  clearTimeout(searchTimer);
  state.stage = 'idle';
  state.porter = null;
  state.left = 0;
  state.stars = 0;
  state.marks = [];
  state.tip = 0;
  state.trip = null;
  state.bags = 1;
  state.note = '';
}

/* ============================================================================
   ОСТАЛЬНЫЕ ШИТЫ
   ========================================================================= */

function sheetStationInfo(id){
  const s = STATIONS.find(x => x.id === id) || stationOf();
  body(
    '<div class="shead">' +
      photo(PHOTOS.station[s.id], s.name, 'shead__art',
            '<span class="shead__art ph">фото вокзала</span>') +
      '<div class="shead__txt"><b>' + s.name + '</b><small>' + s.dir + '</small></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="foot">' +
        fact('Подача', 'от ' + s.wait + ' мин') +
        fact('Цена', 'от ' + money(Math.min.apply(null, SIZES.map(z => z.base)))) +
        fact('На смене', 4 + s.wait % 5) +
      '</div>' +
    '</div>' +

    '<div class="group">Как это работает</div>' +
    '<div class="rows">' + HOW.map((h, i) =>
      '<span class="row">' +
        '<span class="row__ic row__n">' + (i + 1) + '</span>' +
        '<span class="row__body">' +
          '<span class="row__value">' + h[0] + '</span>' +
          '<span class="row__label">' + h[1] + '</span>' +
        '</span>' +
      '</span>').join('') + '</div>' +

    '<div class="group">Куда доносим багаж</div>' +
    zoneTree()
  );
}

function monthOf(date){
  const w = date.split(' ').pop();
  return MONTHS[w] || w[0].toUpperCase() + w.slice(1);
}

function sheetHistory(){
  let out = '', month = '';
  HISTORY.forEach((h, i) => {
    const m = monthOf(h.date);
    if(m !== month){
      out += (month ? '</div>' : '') + '<div class="group">' + m + '</div><div class="rows">';
      month = m;
    }
    out += histRow(h, i);
  });
  body(out + '</div>');
}

/* Прошлый заказ — чек. Повторить его отсюда нельзя и не нужно: у следующей
   поездки другой билет, а без билета заказ всё равно не собрать. В историю
   заходят посмотреть, сколько это стоило и кто нёс. */
function sheetPastOrder(arg){
  const h  = HISTORY[+arg || 0];
  const st = stById(h.st), zn = zoneByName(h.zone);
  const sz = SIZES.find(s => s.id === h.size) || SIZES[0];
  const p  = PORTERS[0];
  const fare = h.sum - (h.tip || 0);

  const bill = (name, note, val) =>
    '<span class="row">' +
      '<span class="row__body">' +
        '<span class="row__value">' + name + '</span>' +
        '<span class="row__label">' + note + '</span>' +
      '</span>' +
      '<span class="row__extra nums">' + money(val) + '</span>' +
    '</span>';

  body(
    '<div class="rcpt">' +
      '<span class="rcpt__when">' + h.date + ', ' + h.time + '</span>' +
      '<b class="rcpt__sum nums">' + money(h.sum) + '</b>' +
      '<span class="rcpt__pay">' + icon('card', 16) + 'Карта •••• 4417</span>' +
    '</div>' +

    '<div class="group">Кто нёс</div>' +
    '<div class="card whom">' +
      '<span class="active__face active__face--l">' + portrait(p) + '</span>' +
      '<span class="whom__txt">' +
        '<b>' + p.name + '</b>' +
        '<span>★ ' + p.rating + ' · жилет №' + p.vest + '</span>' +
      '</span>' +
      starRow(h.stars, 17) +
    '</div>' +

    '<div class="group">Куда донесли</div>' +
    zoneShot(zn, st) +

    '<div class="group">Из чего сложилась сумма</div>' +
    '<div class="rows">' +
      bill(sz.name,
           h.bags + ' ' + plural(h.bags, 'место', 'места', 'мест') + ' · ' + sz.hint,
           fare) +
      (h.tip
        ? bill('Чаевые', 'Сверх стоимости, целиком носильщику', h.tip)
        : '') +
    '</div>' +

    '<div class="list">' +
      '<button class="li li--quiet" type="button" data-act="support">' +
        'Вопрос по этому заказу' +
      '</button>' +
    '</div>'
  );
  foot('');
}

function sheetMe(){
  const n = HISTORY.length;
  const spent = HISTORY.reduce((s, h) => s + h.sum, 0);
  const sts = new Set(HISTORY.map(h => h.st)).size;
  const chev = '<span class="row__chev">' + icon('chev', 18, 2) + '</span>';

  const meRow = (attrs, ic, name, sub, tail) =>
    '<button class="row" type="button" ' + attrs + '>' +
      '<span class="row__ic">' + icon(ic, 21) + '</span>' +
      '<span class="row__body">' +
        '<span class="row__value">' + name + '</span>' +
        '<span class="row__label">' + sub + '</span>' +
      '</span>' + tail +
    '</button>';

  const stat = (val, lab) =>
    '<span class="me__stat"><b class="nums">' + val + '</b><span>' + lab + '</span></span>';

  body(
    '<div class="me">' +
      '<div class="me__top">' +
        '<span class="me__ava">ДА</span>' +
        '<span>' +
          '<span class="me__name">Дмитрий</span>' +
          '<span class="me__phone nums">+7 900 123-45-67</span>' +
        '</span>' +
      '</div>' +
      '<div class="me__stats">' +
        stat(n, plural(n, 'заказ', 'заказа', 'заказов')) +
        stat(money(spent), 'потрачено') +
        stat(sts, plural(sts, 'вокзал', 'вокзала', 'вокзалов')) +
      '</div>' +
    '</div>' +

    '<div class="rows">' +
      meRow('data-act="go" data-to="history"', 'hist', 'История заказов',
            'Чеки и оценки', chev) +
      meRow('data-act="pay"', 'card', 'Способ оплаты',
            'Карта •••• 4417', chev) +
      meRow('data-act="support"', 'help', 'Поддержка',
            'Круглосуточно', chev) +
      meRow('data-act="rules"', 'doc', 'Правила услуги',
            'Встреча, код и ответственность', chev) +
      meRow('data-act="theme"', 'moon', 'Тёмная тема',
            isDark() ? 'Включена' : 'Выключена',
            '<span class="sw' + (isDark() ? ' on' : '') + '" aria-hidden="true"><i></i></span>') +
    '</div>' +

    '<div class="list">' +
      '<button class="li li--quiet" type="button" data-act="signout">Выйти</button>' +
    '</div>'
  );
}

/* Тема живёт в атрибуте на <html>: один переключатель, весь файл офлайн,
   системную схему не слушаем — на вокзале свет меняется чаще настроек */
function isDark(){ return document.documentElement.dataset.theme === 'dark'; }

function toggleTheme(){
  const dark = !isDark();
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', dark ? '#131211' : '#f1f0ee');
  say(dark ? 'Тёмная тема включена' : 'Светлая тема включена');
}

/* ============================================================================
   ПОДЕЛИТЬСЯ ЗАКАЗОМ
   ========================================================================= */

function shareText(){
  const p = state.porter;
  const code = (state.bags + 6) + 'К-' + (400 + p.vest * 3);
  return 'Носильщик ' + p.name + ', жилет №' + p.vest + '.\n' +
         'Встреча: ' + meetPlace().toLowerCase() + '.\n' +
         'Код: ' + code + '.\n' +
         'Дальше — ' + zoneOf().name.toLowerCase() + '.';
}

async function doShare(){
  const text = shareText();
  if(navigator.share){
    try{ await navigator.share({ title:'Носильщик', text:text }); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(text); say('Данные заказа скопированы'); }
  catch(e){ say(text); }
}

/* ============================================================================
   ПРОСТАЯ ЗАМЕТКА. Нужна, чтобы «позвонить», «написать» и «поддержка»
   не были тапами в пустоту: бэкенда нет, но экран честно объясняет, что будет.
   ========================================================================= */

function sheetNote(arg){
  $('sheet-title').textContent = arg.title;
  body(
    '<div class="group">' + arg.head + '</div>' +
    '<p class="lead">' + arg.text + '</p>'
  );
  foot('<button class="btn btn--ghost" type="button" data-act="back">Назад</button>');
}

function notePhone(){
  const p = state.porter;
  return { title:'Звонок', head:'Звонок носильщику',
    text:'Наберём ' + (p ? p.name : 'носильщика') + ' через подменный номер — ' +
         'ваш телефон он не увидит. В прототипе звонок не уходит.' };
}

function noteChat(){
  const p = state.porter;
  return { title:'Чат', head:'Чат с носильщиком',
    text:'Переписка внутри заказа: можно уточнить, где стоите. ' +
         (p ? p.name + ' отвечает обычно за минуту. ' : '') + 'В прототипе чат не подключён.' };
}

const NOTE_SUPPORT = { title:'Поддержка', head:'Поддержка круглосуточно',
  text:'Разбираем спорные ситуации по фотофиксации и коду передачи. ' +
       'В прототипе обращение никуда не уходит.' };

const NOTE_RULES = { title:'Правила', head:'Как работает услуга',
  text:'Носильщик встречает у вагона: платформу и время он берёт из вашего билета. ' +
       'Багаж принимает по коду из приложения и снимает на камеру, когда принимает ' +
       'и когда отдаёт. Доносит до точки внутри вокзала — за его пределы не выходит.' };

const NOTE_OUT = { title:'Выход', head:'Выход из аккаунта',
  text:'В прототипе аккаунт один, данные в нём захардкожены — выходить некуда.' };

const NOTE_PAY = { title:'Оплата', head:'Способ оплаты',
  text:'Списываем с карты после подтверждения «Получил багаж», чаевые — отдельно. ' +
       'В прототипе карта показана для примера.' };

/* ============================================================================
   СОБЫТИЯ ГЛАВНОЙ
   ========================================================================= */

/* Заказ уже идёт — ведём в него, а не начинаем второй.
   Билет уже распознан — сразу к зоне и багажу: просить отсканировать
   второй раз тот же билет незачем. */
function openPorter(){
  if(state.stage === 'searching') return openPage('search');
  if(state.stage !== 'idle')      return openPage('order');
  openPage(state.trip ? 'form' : 'ticket');
}

$('ava-btn').addEventListener('click', () => openPage('me'));
$('go-history').addEventListener('click', () => openPage('history'));
$('go-me').addEventListener('click', () => openPage('me'));
$('active').addEventListener('click', openPorter);
$('call-btn').addEventListener('click', openPorter);

$('last').addEventListener('click', (e) => {
  if(!e.target.closest('[data-act="past"]')) return;
  openPage('past', 0);
});

$('st-cards').addEventListener('click', (e) => {
  const card = e.target.closest('[data-st]');
  if(card) openSheet('stinfo', card.dataset.st);
});

/* ============================================================================
   ДЕЙСТВИЯ. Один делегированный обработчик на экран и на шит: содержимое
   перерисовывается целиком, поэтому слушатель на каждой кнопке был бы
   источником утечек.
   ========================================================================= */

$('page-back').addEventListener('click', backPage);
$('sheet-close').addEventListener('click', closeSheet);
$('sheet-back').addEventListener('click', backSheet);

$('sheet-body').addEventListener('scroll', sheetEdge, { passive:true });
$('sheet-body').addEventListener('load', sheetEdge, true);

function onAct(e){
  if(e.target.closest('[data-close]')) return closeSheet();

  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const act = el.dataset.act;

  /* --- шаг 1: билет --- */
  if(act === 'scan')   return applyTicket(DEMO_TICKET);
  if(act === 'manual') { clearTimeout(scanTimer); return pushPage('manual'); }

  if(act === 'demo-ticket'){
    const f = $('tk');
    f.value = '7412 0093 8140 21';
    checkManual();
    return;
  }
  if(act === 'read-manual') return applyTicket($('tk').value);

  /* --- шаг 2: зона и багаж на одном экране --- */
  if(act === 'zone'){
    state.zone = el.dataset.id;
    /* выбор применяется на месте: галочка переезжает, цена и маршрут
       пересчитываются — экран не подменяется */
    $('page-body').querySelectorAll('.check').forEach(c => c.classList.remove('on'));
    el.querySelector('.check').classList.add('on');
    renderBags();
    return;
  }

  if(act === 'zone-map')  return pushSheet('zmap');

  if(act === 'cmnt') return pushSheet('cmnt');

  /* Подсказка не галочка, а заготовка текста: дописываем и отдаём поле человеку */
  if(act === 'note-add'){
    const ta = $('note-ta'), t = el.dataset.t;
    const has = ta.value.trim().replace(/[,.\s]+$/, '');
    ta.value = has ? has + ', ' + t.toLowerCase() : t;
    ta.focus();
    return;
  }

  if(act === 'note-save'){
    state.note = $('note-ta').value.trim();
    closeSheet();
    return paintPage();
  }

  if(act === 'zone-done'){
    closeSheet();
    return paintPage();          /* вернулись на форму — цена уже новая */
  }

  if(act === 'when'){ state.when = el.dataset.id; return renderBags(); }
  if(act === 'size'){ state.size = el.dataset.id; return renderBags(); }
  if(act === 'bag-plus'){  state.bags = Math.min(6, state.bags + 1); return renderBags(); }
  if(act === 'bag-minus'){ state.bags = Math.max(1, state.bags - 1); return renderBags(); }
  if(act === 'call') return startSearch();

  /* --- жизненный цикл --- */
  if(act === 'cancel')   return cancelOrder();
  if(act === 'handover') return handOver();
  if(act === 'finish')   return finishOrder();

  /* Демо: мгновенный переход на следующую стадию вместо ожидания таймера */
  if(act === 'skip'){
    clearInterval(tickTimer);
    if(state.stage === 'assigned') return arrive();
    if(state.stage === 'picked')   return deliver();
    return;
  }

  /* --- оценка --- */
  if(act === 'star'){
    state.stars = +el.dataset.n;
    renderStars();
    /* каскад: звёзды загораются одна за другой */
    $('stars').querySelectorAll('button.on').forEach((b, i) =>
      setTimeout(() => replay(b, 'pop'), i * 55));
    return renderSendBtn();
  }

  if(act === 'mark'){
    const nm = el.dataset.name;
    const i = state.marks.indexOf(nm);
    if(i > -1) state.marks.splice(i, 1); else state.marks.push(nm);
    renderMarks();
    const again = $('tags').querySelector('[data-name="' + nm + '"]');
    if(i === -1) replay(again, 'pop');
    return;
  }

  if(act === 'tip'){ state.tip = +el.dataset.t; renderTips(); return renderSendBtn(); }
  if(act === 'send') return submitRating();

  /* --- связь и навигация --- */
  if(act === 'share')   return doShare();
  if(act === 'phone')   return pushSheet('note', notePhone());
  if(act === 'chat')    return pushSheet('note', noteChat());
  if(act === 'support') return pushSheet('note', NOTE_SUPPORT);
  if(act === 'pay')     return pushSheet('note', NOTE_PAY);
  if(act === 'rules')   return pushSheet('note', NOTE_RULES);
  if(act === 'signout') return pushSheet('note', NOTE_OUT);

  if(act === 'go')       return pushPage(el.dataset.to);
  if(act === 'past')     return pushPage('past', el.dataset.i);

  /* Тёмная тема — переключателем в кабинете, а не системной настройкой */
  if(act === 'theme'){ toggleTheme(); return paintPage(); }

  if(act === 'home')  return goHome();
  if(act === 'back')  return backSheet();
  if(act === 'close') return closeSheet();
}

$('page').addEventListener('click', onAct);
$('sheet').addEventListener('click', onAct);

/* Кнопка «Найти рейс» активна, только когда номер похож на настоящий */
function checkManual(){
  const f = $('tk'), btn = document.querySelector('[data-act="read-manual"]');
  if(!f || !btn) return;
  btn.disabled = f.value.replace(/\D/g, '').length < 14;
}

$('page').addEventListener('input', (e) => {
  if(e.target.id === 'tk') checkManual();
});

/* Escape ведёт себя как стрелка «назад»: сначала закрывает шит,
   потом отступает по экранам, последним шагом — на главную */
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(!$('sheet').hidden) return backSheet();
  if(!$('page').hidden)  return backPage();
});

/* ============================================================================
   СТАРТ
   ========================================================================= */

renderHome();
</script>
</body>
</html>
